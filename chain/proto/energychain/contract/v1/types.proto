syntax = "proto3";
package energychain.contract.v1;

import "gogoproto/gogo.proto";

option go_package = "energychain/x/contract/types";

// Kind enumerates the supported bilateral contract families.
//
// PPA  — Physical PPA. Buyer pays seller strike_price * delivered
//        quantity per period (delivered = oracle-read from
//        quantity_oracle_topic, or notional_quantity when the
//        topic is empty). Direction: buyer -> seller.
//
// VPPA — Virtual PPA / floor swap. Seller pays buyer max(0,
//        strike - index) * notional per period. Buyer is hedged
//        against low spot. Direction: seller -> buyer when
//        index < strike; otherwise zero.
//
// CFD  — Contract for Difference. Settlement = (index - strike)
//        * notional. Positive -> seller pays buyer (buyer wins
//        the difference); negative -> buyer pays seller.
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_PPA         = 1;
  KIND_VPPA        = 2;
  KIND_CFD         = 3;
}

// Status is the contract lifecycle.
//
// DRAFT      — created, awaiting counterparty signature and
//              margin. Margin can be posted; signature can be
//              withdrawn.
// ACTIVE     — both parties signed AND both margins >=
//              margin_requirement. Settlements run on this
//              status.
// PAUSED     — explicit pause by governance (e.g. emergency
//              halt of all PPAs of a kind). Mutating ops refuse;
//              settlements halt.
// DISPUTED   — flagged by dispute module (or governance until
//              x/dispute lands). Settlements halt until resolved.
// TERMINATED — mutually terminated (both parties signed a
//              terminate). Margins refundable on Withdraw.
// EXPIRED    — end_time reached. Margins refundable on Withdraw.
//              Late settlements between end_time and Withdraw
//              are refused.
// DEFAULTED  — counterparty failed to maintain a settle within
//              grace_period_seconds. Defaulting party's margin
//              is fully slashed to the non-defaulting party as
//              part of the Default tx.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_DRAFT       = 1;
  STATUS_ACTIVE      = 2;
  STATUS_PAUSED      = 3;
  STATUS_DISPUTED    = 4;
  STATUS_TERMINATED  = 5;
  STATUS_EXPIRED     = 6;
  STATUS_DEFAULTED   = 7;
}

// Contract is one bilateral agreement.
//
// Accounting model:
//   - Both parties pre-fund margin into the streampay-like
//     pool (a deterministic module address). margin_buyer /
//     margin_seller track the per-party balance.
//   - Each Settle moves a computed amount between the
//     in-keeper margin balances. The pool itself only changes
//     on DepositMargin / WithdrawMargin / Default. This keeps
//     settlement cheap (no stablecoin Move per period).
//   - On terminal status, parties withdraw their remaining
//     margin balance back to their own account.
//
// Pricing units:
//   - strike_price is in micro-units of asset_denom per unit of
//     quantity (scaled by 10^PriceScaleDecimals).
//   - notional_quantity is unscaled.
//   - Oracle quantity / price readings are interpreted in the
//     same micro-units. Off-chain producers MUST stamp the
//     correct decimal scaling on their oracle topic.
message Contract {
  uint64 id = 1;
  Kind kind = 2;
  Status status = 3;

  string buyer = 4;
  string seller = 5;

  // schema_uri / schema_hash anchor the off-chain template
  // PDF / JSON-LD. Chain neither parses nor validates the
  // schema body; only the hash is used to detect tampering of
  // a referenced template.
  string schema_uri = 6;
  bytes  schema_hash = 7;

  string asset_denom = 8;          // settlement currency (stablecoin)
  uint64 strike_price = 9;          // micro-units / unit-of-quantity
  uint64 notional_quantity = 10;
  string price_oracle_topic = 11;
  string quantity_oracle_topic = 12;
  int64  max_oracle_staleness_seconds = 13;

  uint64 margin_requirement = 14;
  uint64 margin_buyer = 15;
  uint64 margin_seller = 16;

  int64  settlement_period_seconds = 17;
  int64  next_settlement_time = 18;
  int64  last_settled_time = 19;
  uint64 settlements_count = 20;

  // Cumulative ledger-style observability. These are NEVER
  // decremented and form the "what was paid net-to-date"
  // statement for both off-chain auditors and the upcoming
  // x/mrv reporting flow.
  uint64 cumulative_buyer_to_seller = 21;
  uint64 cumulative_seller_to_buyer = 22;

  int64  start_time = 23;
  int64  end_time   = 24;
  int64  grace_period_seconds = 25; // overdue tolerance before Default
  int64  terminate_signal_mask = 26; // bit-mask of who signed terminate (1=buyer, 2=seller)

  bool signed_by_buyer = 27;
  bool signed_by_seller = 28;

  bool dispute_locked = 29;

  int64 created_at = 30;
  int64 activated_at = 31;
  int64 terminated_at = 32;

  string memo = 33;
}

message Params {
  uint32 max_contracts = 1;
  uint32 max_contracts_per_party = 2;
  int64  min_settlement_period_seconds = 3;
  int64  max_settlement_period_seconds = 4;
  int64  default_grace_period_seconds = 5;
  // max_oracle_staleness_seconds_cap is the hard ceiling on
  // per-contract max_oracle_staleness_seconds. Sized so a
  // sensible chain operator cannot accidentally accept a
  // week-old oracle as "fresh".
  int64 max_oracle_staleness_seconds_cap = 6;
  // max_catchup_periods_per_settle bounds how many overdue
  // periods one Settle tx can clear. Sized so a single tx
  // cannot exhaust block gas in catch-up.
  uint32 max_catchup_periods_per_settle = 7;
  uint32 memo_max_len = 8;
}

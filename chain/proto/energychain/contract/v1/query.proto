syntax = "proto3";
package energychain.contract.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";

import "energychain/contract/v1/types.proto";

option go_package = "energychain/x/contract/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);
  rpc Contract(QueryContractRequest) returns (QueryContractResponse);
  rpc Contracts(QueryContractsRequest) returns (QueryContractsResponse);
  rpc ContractsByParty(QueryContractsByPartyRequest) returns (QueryContractsByPartyResponse);
  rpc PoolAddress(QueryPoolAddressRequest) returns (QueryPoolAddressResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }

message QueryContractRequest { uint64 id = 1; }
message QueryContractResponse { Contract contract = 1 [(gogoproto.nullable) = false]; }

message QueryContractsRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryContractsResponse {
  repeated Contract contracts = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryContractsByPartyRequest {
  string party = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryContractsByPartyResponse {
  repeated Contract contracts = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryPoolAddressRequest {}
message QueryPoolAddressResponse { string pool = 1; }

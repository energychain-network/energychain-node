syntax = "proto3";
package energychain.mrv.v1;

import "gogoproto/gogo.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "energychain/mrv/v1/types.proto";

option go_package = "energychain/x/mrv/types";

service Query {
  rpc Params      (QueryParamsRequest)      returns (QueryParamsResponse);
  rpc Schema      (QuerySchemaRequest)      returns (QuerySchemaResponse);
  rpc Schemas     (QuerySchemasRequest)     returns (QuerySchemasResponse);
  rpc Verifier    (QueryVerifierRequest)    returns (QueryVerifierResponse);
  rpc Verifiers   (QueryVerifiersRequest)   returns (QueryVerifiersResponse);
  rpc Report      (QueryReportRequest)      returns (QueryReportResponse);
  rpc Reports     (QueryReportsRequest)     returns (QueryReportsResponse);
  rpc ViewKeyGrant (QueryViewKeyGrantRequest) returns (QueryViewKeyGrantResponse);
  rpc ViewKeyGrants(QueryViewKeyGrantsRequest)returns (QueryViewKeyGrantsResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }

message QuerySchemaRequest  { uint64 id = 1; }
message QuerySchemaResponse { Schema schema = 1 [(gogoproto.nullable) = false]; }

message QuerySchemasRequest  {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
  // Optional filters:
  AssetClass asset_class = 2;
  SchemaStatus status = 3;
}
message QuerySchemasResponse {
  repeated Schema schemas = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryVerifierRequest  { uint64 id = 1; }
message QueryVerifierResponse { Verifier verifier = 1 [(gogoproto.nullable) = false]; }

message QueryVerifiersRequest  {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
  VerifierStatus status = 2;
}
message QueryVerifiersResponse {
  repeated Verifier verifiers = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryReportRequest  { uint64 id = 1; }
message QueryReportResponse { Report report = 1 [(gogoproto.nullable) = false]; }

message QueryReportsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
  // Optional filters (server-side narrows by index when possible):
  string subject = 2;
  uint64 schema_id = 3;
  ReportStatus status = 4;
}
message QueryReportsResponse {
  repeated Report reports = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryViewKeyGrantRequest  { uint64 id = 1; }
message QueryViewKeyGrantResponse { ViewKeyGrant grant = 1 [(gogoproto.nullable) = false]; }

message QueryViewKeyGrantsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
  string grantee_did = 2; // optional filter
  string granter = 3;     // optional filter
}
message QueryViewKeyGrantsResponse {
  repeated ViewKeyGrant grants = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

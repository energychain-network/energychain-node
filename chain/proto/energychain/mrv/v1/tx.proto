syntax = "proto3";
package energychain.mrv.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "energychain/mrv/v1/types.proto";

option go_package = "energychain/x/mrv/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc RegisterSchema      (MsgRegisterSchema)      returns (MsgRegisterSchemaResponse);
  rpc UpdateSchemaStatus  (MsgUpdateSchemaStatus)  returns (MsgUpdateSchemaStatusResponse);

  rpc RegisterVerifier    (MsgRegisterVerifier)    returns (MsgRegisterVerifierResponse);
  rpc UpdateVerifierStatus(MsgUpdateVerifierStatus)returns (MsgUpdateVerifierStatusResponse);

  rpc SubmitReport        (MsgSubmitReport)        returns (MsgSubmitReportResponse);
  rpc AttestReport        (MsgAttestReport)        returns (MsgAttestReportResponse);
  rpc RejectReport        (MsgRejectReport)        returns (MsgRejectReportResponse);
  rpc RetractReport       (MsgRetractReport)       returns (MsgRetractReportResponse);

  rpc GrantViewKey        (MsgGrantViewKey)        returns (MsgGrantViewKeyResponse);
  rpc RevokeViewKey       (MsgRevokeViewKey)       returns (MsgRevokeViewKeyResponse);

  rpc UpdateParams        (MsgUpdateParams)        returns (MsgUpdateParamsResponse);
}

// ---- Schemas (authority-only) ------------------------------------------

message MsgRegisterSchema {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string name = 2;
  string version = 3;
  string jurisdiction = 4;
  AssetClass asset_class = 5;
  TimeWindow time_window = 6;
  ReportFormat output_format = 7;
  string schema_uri = 8;
  string schema_hash = 9;
}
message MsgRegisterSchemaResponse { uint64 schema_id = 1; }

message MsgUpdateSchemaStatus {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  uint64 schema_id = 2;
  SchemaStatus new_status = 3;
  string reason = 4;
}
message MsgUpdateSchemaStatusResponse {}

// ---- Verifiers (authority-only) ---------------------------------------

message MsgRegisterVerifier {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string did = 2;
  string name = 3;
  repeated string accredited_standards = 4;
  repeated string jurisdictions = 5;
  // signer_address is the bech32 chain address authorised
  // to send AttestReport / RejectReport on behalf of this
  // verifier. REQUIRED. See Verifier.signer_address for why
  // this exists separately from the DID.
  string signer_address = 6;
}
message MsgRegisterVerifierResponse { uint64 verifier_id = 1; }

message MsgUpdateVerifierStatus {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  uint64 verifier_id = 2;
  VerifierStatus new_status = 3;
  string reason = 4;
}
message MsgUpdateVerifierStatusResponse {}

// ---- Reports ------------------------------------------------------------

// SubmitReport is signed by the subject. The submitter must
// match the subject address. Authority may submit on behalf
// of a subject (close-out flow for delinquent reporters).
message MsgSubmitReport {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string subject = 2;
  uint64 schema_id = 3;
  int64 period_start = 4;
  int64 period_end = 5;
  string payload_uri = 6;
  string payload_hash = 7;
  ReportAggregate aggregate = 8 [(gogoproto.nullable) = false];
  string memo = 9;
}
message MsgSubmitReportResponse { uint64 report_id = 1; }

// AttestReport is signed by the verifier's chain address.
// The verifier must be ACCREDITED. The report must be DRAFT.
message MsgAttestReport {
  option (cosmos.msg.v1.signer) = "verifier_address";
  string verifier_address = 1;
  uint64 verifier_id = 2;
  uint64 report_id = 3;
  string verifier_payload_uri = 4;
  string verifier_payload_hash = 5;
}
message MsgAttestReportResponse {}

// RejectReport is signed by the verifier and moves the report
// to REJECTED. A new report (separate id) is required to fix
// the issue.
message MsgRejectReport {
  option (cosmos.msg.v1.signer) = "verifier_address";
  string verifier_address = 1;
  uint64 verifier_id = 2;
  uint64 report_id = 3;
  string reason = 4;
}
message MsgRejectReportResponse {}

// RetractReport flips status to RETRACTED. Either the report
// subject or the authority can retract; retraction is final.
message MsgRetractReport {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 report_id = 2;
  string reason = 3;
}
message MsgRetractReportResponse {}

// ---- View-key grants ----------------------------------------------------

// GrantViewKey is signed by the subject (granter). The grant
// authorizes a regulator DID to decrypt one or all of the
// subject's report payloads off-chain for a bounded window.
// expires_at must be in the future and ≤ max_grant_ttl_seconds.
message MsgGrantViewKey {
  option (cosmos.msg.v1.signer) = "granter";
  string granter = 1;
  string grantee_did = 2;
  uint64 report_id = 3; // 0 = all
  uint64 schema_id = 4; // 0 = all
  int64 expires_at = 5;
}
message MsgGrantViewKeyResponse { uint64 grant_id = 1; }

// RevokeViewKey may be called by the granter OR the
// authority. Idempotent — revoking a revoked or expired
// grant is a no-op.
message MsgRevokeViewKey {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 grant_id = 2;
  string reason = 3;
}
message MsgRevokeViewKeyResponse {}

// ---- Params -------------------------------------------------------------

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

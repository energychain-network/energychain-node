syntax = "proto3";
package energychain.mrv.v1;

import "gogoproto/gogo.proto";

option go_package = "energychain/x/mrv/types";

// SchemaStatus tracks the lifecycle of a report schema.
// ACTIVE schemas accept new reports; DEPRECATED schemas may
// still be queried but new reports are refused.
enum SchemaStatus {
  SCHEMA_STATUS_UNSPECIFIED = 0;
  SCHEMA_STATUS_ACTIVE      = 1;
  SCHEMA_STATUS_DEPRECATED  = 2;
}

// AssetClass identifies which underlying chain data the
// schema aggregates over. MIXED is a catch-all for reports
// that pull from multiple modules.
enum AssetClass {
  ASSET_CLASS_UNSPECIFIED = 0;
  ASSET_CLASS_METER       = 1;
  ASSET_CLASS_EAC         = 2;
  ASSET_CLASS_CARBON      = 3;
  ASSET_CLASS_CFE_247     = 4;
  ASSET_CLASS_MIXED       = 5;
}

// TimeWindow is the canonical aggregation period the schema
// is designed for. The chain does NOT enforce period
// granularity at submission — it just records the schema's
// intent for off-chain verifiers.
enum TimeWindow {
  TIME_WINDOW_UNSPECIFIED = 0;
  TIME_WINDOW_HOURLY      = 1;
  TIME_WINDOW_DAILY       = 2;
  TIME_WINDOW_MONTHLY     = 3;
  TIME_WINDOW_QUARTERLY   = 4;
  TIME_WINDOW_YEARLY      = 5;
  TIME_WINDOW_AD_HOC      = 6;
}

// ReportFormat identifies the off-chain serialization format
// of the payload pointed to by payload_uri. The chain only
// stores the hash + URI; the format is metadata for tooling.
enum ReportFormat {
  REPORT_FORMAT_UNSPECIFIED = 0;
  REPORT_FORMAT_JSON_LD     = 1; // W3C JSON-LD VC envelope
  REPORT_FORMAT_XBRL        = 2; // XBRL financial reporting
  REPORT_FORMAT_ENERGYTAG   = 3; // EnergyTag granular cert
  REPORT_FORMAT_CSRD_ESRS   = 4; // EU CSRD / ESRS
  REPORT_FORMAT_CDP         = 5;
  REPORT_FORMAT_TCFD        = 6;
  REPORT_FORMAT_GHG_PROTO   = 7; // GHG Protocol Scope 1/2/3
  REPORT_FORMAT_RE100       = 8;
}

enum ReportStatus {
  REPORT_STATUS_UNSPECIFIED = 0;
  REPORT_STATUS_DRAFT       = 1; // submitted, no verifier sig
  REPORT_STATUS_ATTESTED    = 2; // verifier signed
  REPORT_STATUS_REJECTED    = 3; // verifier rejected
  REPORT_STATUS_RETRACTED   = 4; // retracted by subject/authority
}

enum VerifierStatus {
  VERIFIER_STATUS_UNSPECIFIED = 0;
  VERIFIER_STATUS_ACCREDITED  = 1;
  VERIFIER_STATUS_SUSPENDED   = 2;
  VERIFIER_STATUS_REVOKED     = 3;
}

// Schema describes a report template.
message Schema {
  uint64 id = 1;
  string name = 2;
  string version = 3;
  string jurisdiction = 4; // ISO-3166-1 alpha-2, or "GLOBAL"
  AssetClass asset_class = 5;
  TimeWindow time_window = 6;
  ReportFormat output_format = 7;
  string schema_uri = 8;   // off-chain JSON Schema / XBRL taxonomy URL
  string schema_hash = 9;  // sha256 of the schema document, hex
  SchemaStatus status = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
}

// Verifier is an accredited third-party attestor.
//
// signer_address is the bech32 chain address the verifier
// must use to sign AttestReport / RejectReport messages.
// The DID provides off-chain identity (W3C VC envelopes),
// while signer_address provides ALWAYS-ON, chain-native
// enforcement that does not rely on a DIDKeeper being wired.
// When a DIDKeeper IS wired, the signer is additionally
// verified to be a current controller of `did` — but in
// either case signer_address remains the canonical attestor.
message Verifier {
  uint64 id = 1;
  string did = 2;  // verifier's W3C DID
  string name = 3;
  repeated string accredited_standards = 4; // e.g. "ISO-14064", "Verra-VVB"
  repeated string jurisdictions = 5;        // ISO-3166-1 alpha-2 codes
  VerifierStatus status = 6;
  int64 accredited_at = 7;
  int64 updated_at = 8;
  string signer_address = 9;
}

// ReportAggregate is the on-chain summary the subject claims
// for the period. The verifier signs the off-chain payload;
// these aggregates exist on-chain to support fast queries,
// invariant checks across modules, and reporting dashboards.
message ReportAggregate {
  uint64 meter_wh = 1;
  uint64 eac_issued_wh = 2;
  uint64 eac_retired_wh = 3;
  // 0.001 tCO2e units (milli-tCO2e) for sub-tonne precision.
  uint64 carbon_retired_milli_tco2e = 4;
  uint32 cfe247_hourly_score_bps = 5; // basis points 0-10000
  uint32 cfe247_annual_score_bps = 6;
  uint64 record_count = 7;
}

// Report is the on-chain manifest for one report instance.
// The actual payload lives off-chain; the chain holds the
// cryptographic anchor, the aggregate summary, and the
// lifecycle / verifier state.
message Report {
  uint64 id = 1;
  uint64 schema_id = 2;
  string subject = 3;     // bech32 address of the reporting entity
  int64 period_start = 4; // unix seconds, inclusive
  int64 period_end = 5;   // unix seconds, exclusive
  string payload_uri = 6;
  string payload_hash = 7; // sha256 hex
  ReportAggregate aggregate = 8 [(gogoproto.nullable) = false];
  ReportStatus status = 9;
  uint64 verifier_id = 10;          // 0 = pending
  string verifier_payload_uri = 11; // off-chain VC envelope URI
  string verifier_payload_hash = 12;
  int64 submitted_at = 13;
  int64 attested_at = 14;
  string memo = 15;
}

// ViewKeyGrant is the authorization a subject issues to a
// regulator so the regulator can decrypt the off-chain
// payload of one or more reports for a bounded period.
message ViewKeyGrant {
  uint64 id = 1;
  string granter = 2;        // subject address
  string grantee_did = 3;    // regulator DID
  uint64 report_id = 4;      // 0 = all reports for granter
  uint64 schema_id = 5;      // 0 = all schemas
  int64 expires_at = 6;
  bool revoked = 7;
  int64 created_at = 8;
}

message Params {
  uint32 max_schemas = 1;
  uint32 max_verifiers = 2;
  uint32 max_reports_per_subject = 3;
  uint32 max_view_key_grants = 4;
  uint32 memo_max_len = 5;
  uint32 uri_max_len = 6;
  uint32 max_jurisdictions_per_verifier = 7;
  uint32 max_standards_per_verifier = 8;
  uint32 reason_max_len = 9;
  int64 max_grant_ttl_seconds = 10;
  uint32 max_grants_per_block_sweep = 11; // expired-grant sweep cap
}

syntax = "proto3";
package energychain.mincast.v1;

import "gogoproto/gogo.proto";
import "energychain/mincast/v1/types.proto";

option go_package = "energychain/x/mincast/types";

message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated Market markets = 2 [(gogoproto.nullable) = false];
  repeated Balance balances = 3 [(gogoproto.nullable) = false];
  repeated Invest invests = 4 [(gogoproto.nullable) = false];
  uint64 market_id_seq = 5;
  uint64 invest_id_seq = 6;
}

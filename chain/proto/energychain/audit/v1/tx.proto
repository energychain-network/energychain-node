syntax = "proto3";
package energychain.audit.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "energychain/audit/v1/types.proto";

option go_package = "energychain/x/audit/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  // Existing M0 entry-points.
  rpc RecordAudit(MsgRecordAudit) returns (MsgRecordAuditResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // M1 evolution.
  rpc RegisterSchema(MsgRegisterSchema) returns (MsgRegisterSchemaResponse);
  rpc DeprecateSchema(MsgDeprecateSchema) returns (MsgDeprecateSchemaResponse);
  rpc Archive(MsgArchive) returns (MsgArchiveResponse);
  rpc GrantViewKey(MsgGrantViewKey) returns (MsgGrantViewKeyResponse);
  rpc RevokeViewKey(MsgRevokeViewKey) returns (MsgRevokeViewKeyResponse);
}

message MsgRecordAudit {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string event_type = 2;
  string target = 3;
  string action = 4;
  string data = 5;

  // M1 evolution fields. Severity defaults to INFO when zero. schema_id
  // empty means the writer is not declaring a schema. payload_encrypted
  // signals the off-chain envelope semantics; payload_digest is the
  // sha256 of the cleartext used to detect ciphertext tampering.
  Severity severity = 6;
  string schema_id = 7;
  bool payload_encrypted = 8;
  string payload_digest = 9;
}
message MsgRecordAuditResponse {
  uint64 id = 1 [(gogoproto.customname) = "ID"];
}

// MsgUpdateParams replaces the entire audit module Params. Signer must be
// the module authority (gov module address).
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

// MsgRegisterSchema pins or bumps a self-describing schema. Governance
// authority only — schemas are part of the chain's compliance contract,
// not user-controlled.
message MsgRegisterSchema {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  SchemaDescriptor descriptor = 2 [(gogoproto.nullable) = false];
}
message MsgRegisterSchemaResponse {}

message MsgDeprecateSchema {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string event_type = 2;
}
message MsgDeprecateSchemaResponse {}

// MsgArchive seals a contiguous span of logs into an external batch and
// removes the originals from the live store. Authority must be either the
// gov address or one of params.archive_authorities. The actual upload to
// IPFS / Filecoin / S3 is off-chain; this message records the digest +
// URI so the externalised batch becomes verifiable.
message MsgArchive {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 from_log_id = 2;
  uint64 to_log_id = 3;
  string merkle_root = 4;
  string merkle_algorithm = 5; // defaults to sha256 if empty
  string uri = 6;
}
message MsgArchiveResponse {
  uint64 segment_id = 1;
  uint64 evicted = 2;
}

// MsgGrantViewKey hands an opaque encrypted symmetric key to a grantee.
// The grantor is the actor responsible for the underlying logs (e.g. the
// chain authority for governance events, or the target's controlling DID
// for target-scoped grants). The chain refuses to issue grants whose
// expires_at exceeds params.view_key_max_validity.
message MsgGrantViewKey {
  option (cosmos.msg.v1.signer) = "grantor";

  string grantor = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string grantee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  ViewScope scope = 3 [(gogoproto.nullable) = false];
  bytes encrypted_key = 4;
  int64 expires_at = 5;
}
message MsgGrantViewKeyResponse {
  string grant_id = 1;
}

message MsgRevokeViewKey {
  option (cosmos.msg.v1.signer) = "actor";

  string actor = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string grant_id = 2;
  string reason = 3;
}
message MsgRevokeViewKeyResponse {}

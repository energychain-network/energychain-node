syntax = "proto3";
package energychain.audit.v1;

import "gogoproto/gogo.proto";

option go_package = "energychain/x/audit/types";

// Severity is the alerting tier for a recorded event. Subscribers (off-chain
// SOC dashboards, alerting bots, MRV pipelines) filter by this so a flood
// of INFO-level traffic does not drown out an emergency freeze.
//
// SEVERITY_INFO is the proto3 default and matches the historical M0 logs
// that did not declare a severity.
enum Severity {
  SEVERITY_INFO = 0;
  SEVERITY_NOTICE = 1;
  SEVERITY_WARN = 2;
  SEVERITY_CRITICAL = 3;
  SEVERITY_FATAL = 4;
}

// AuditLog is a single audit trail entry persisted on-chain.
//
// Fields 1-9 are the original M0 schema. Fields 10+ are the M1 evolution
// (severity, schema_id, view-key envelope). proto3 keeps wire compat:
// pre-M1 logs decode with the new fields zero-valued.
message AuditLog {
  uint64 id = 1 [(gogoproto.customname) = "ID"];
  string event_type = 2;
  string actor = 3;
  string target = 4;
  string action = 5;
  // data is either the cleartext JSON / opaque bytes (legacy behaviour) or
  // an envelope-encrypted payload when payload_encrypted == true. The
  // chain treats it as opaque; off-chain SDKs parse it per schema_id.
  string data = 6;
  int64 block_height = 7;
  int64 timestamp = 8;
  string tx_hash = 9;

  // M1 evolution fields:
  Severity severity = 10;
  // schema_id matches a SchemaDescriptor.event_type in the registry. Empty
  // string means "no declared schema" (legacy / ad-hoc events). Keeping it
  // separate from event_type lets a single schema cover multiple
  // event_type variants (e.g. "param_update.x/eac" + "param_update.x/cfe247"
  // both pointing at "schemas/param_update.v3.json").
  string schema_id = 11;
  // payload_encrypted toggles the envelope semantics for `data`. When true,
  // `data` is base64 of an opaque ciphertext only resolvable by a granted
  // view key holder. The chain enforces no decryption — it only enforces
  // who may grant the view key.
  bool payload_encrypted = 12;
  // payload_digest is sha256(canonical-cleartext-bytes) so an off-chain
  // verifier can confirm the decrypted bytes match what the writer
  // committed to, even if the ciphertext travels via untrusted relays.
  // Empty for unencrypted logs.
  string payload_digest = 13;
}

// SchemaDescriptor pins the URI + content hash of a self-describing event
// schema (typically JSON-Schema or JSON-LD). Off-chain tools resolve a
// log's schema_id to this descriptor, fetch the URI, verify the hash, and
// then parse `data` accordingly. Storing only the URI + hash on-chain
// keeps the audit module tiny while making the schema tamper-evident.
message SchemaDescriptor {
  string event_type = 1;       // canonical id, doubles as map key
  string uri = 2;              // ipfs://, https://, ar://, ...
  string hash = 3;             // sha256 hex of the resolved schema bytes
  uint32 version = 4;          // monotonically incremented per event_type
  string registered_by = 5;    // governance authority bech32
  int64 registered_at = 6;
  bool deprecated = 7;
  int64 deprecated_at = 8;
}

// ArchiveSegment captures the on-chain digest left behind after old logs
// have been moved to external storage (IPFS / Filecoin / S3). The segment
// itself is immutable: it carries the inclusive id range, the merkle root
// over canonicalised log bytes, the count of evicted rows, and the URI of
// the externalised batch.
//
// merkle_algorithm doubles as a forward-compat hook so a future archive
// pipeline can switch from sha256 to keccak256 / blake3 without rewriting
// older segments.
message ArchiveSegment {
  uint64 id = 1 [(gogoproto.customname) = "ID"];
  uint64 from_log_id = 2;
  uint64 to_log_id = 3;
  uint64 log_count = 4;
  string merkle_root = 5;       // hex
  string merkle_algorithm = 6;  // "sha256" today
  string uri = 7;               // off-chain payload location
  string archived_by = 8;       // bech32 of the actor that called Archive
  int64 archived_at = 9;
  // earliest_timestamp / latest_timestamp let regulators bound queries
  // without re-fetching the segment payload.
  int64 earliest_timestamp = 10;
  int64 latest_timestamp = 11;
}

// ViewScope narrows what a view-key grant lets the holder decrypt.
// Empty fields mean "no restriction" along that dimension. The chain does
// not enforce decryption (no symmetric key ever leaves the grant blob);
// it enforces who is named in the grant and when.
message ViewScope {
  string event_type_prefix = 1;  // matches AuditLog.event_type by prefix
  string target_prefix = 2;      // matches AuditLog.target by prefix
  int64 from_timestamp = 3;
  int64 to_timestamp = 4;
}

// ViewKeyGrant authorises a regulator (or any DID-bearing party) to
// decrypt the encrypted payload of a defined slice of audit logs. The
// chain stores `encrypted_key` opaquely: it is the symmetric envelope key
// used to encrypt log.data, itself wrapped to the grantee's public key.
// Off-chain tooling unwraps and uses it; revocation immediately blocks
// new grants from being issued but cannot retroactively erase prior copies
// the grantee may have cached.
message ViewKeyGrant {
  string id = 1;
  string grantor = 2;
  string grantee = 3;
  ViewScope scope = 4 [(gogoproto.nullable) = false];
  bytes encrypted_key = 5;
  int64 granted_at = 6;
  int64 expires_at = 7;          // 0 = never expires
  bool revoked = 8;
  int64 revoked_at = 9;
  string revocation_reason = 10;
}

// Params defines the configurable parameters for the audit module.
//
// max_audits_per_block_per_creator limits the number of MsgRecordAudit txs a
// single creator can land in one block (0 disables the limit).
//
// archive_min_age_blocks is the lower bound a log must reach before it can
// be sealed into an ArchiveSegment via MsgArchive. Combined with the
// existing retention_blocks it lets governance both schedule (when) and
// batch (how) the eviction.
//
// view_key_max_validity caps how far in the future a ViewKeyGrant may
// expire. 0 disables the cap.
//
// archive_max_batch caps the number of logs a single MsgArchive may evict
// to keep block gas predictable.
message Params {
  uint64 large_transfer_threshold = 1;
  int64 retention_blocks = 2;
  repeated string allowed_auditors = 3;
  uint32 max_data_size = 4;
  bool permissionless = 5;
  uint32 max_audits_per_block_per_creator = 6;

  // M1 evolution params:
  int64 archive_min_age_blocks = 7;
  int64 view_key_max_validity = 8;
  uint32 archive_max_batch = 9;
  // archive_authorities lists bech32 addresses that may call MsgArchive
  // outside of governance. Empty means "gov authority only".
  repeated string archive_authorities = 10;
}

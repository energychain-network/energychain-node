syntax = "proto3";
package energychain.audit.v1;

import "gogoproto/gogo.proto";
import "energychain/audit/v1/types.proto";

option go_package = "energychain/x/audit/types";

message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated AuditLog logs = 2 [(gogoproto.nullable) = false];
  uint64 counter = 3;

  // M1 evolution.
  repeated SchemaDescriptor schemas = 4 [(gogoproto.nullable) = false];
  repeated ArchiveSegment archive_segments = 5 [(gogoproto.nullable) = false];
  uint64 archive_counter = 6;
  repeated ViewKeyGrant view_key_grants = 7 [(gogoproto.nullable) = false];
  // grant_counter feeds the deterministic id generator for new grants.
  uint64 grant_counter = 8;
}

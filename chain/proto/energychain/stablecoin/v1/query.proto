syntax = "proto3";
package energychain.stablecoin.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";

import "energychain/stablecoin/v1/types.proto";

option go_package = "energychain/x/stablecoin/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);

  // ---- Denom ----
  rpc Denom(QueryDenomRequest) returns (QueryDenomResponse);
  rpc Denoms(QueryDenomsRequest) returns (QueryDenomsResponse);

  // ---- Issuer ----
  rpc Issuer(QueryIssuerRequest) returns (QueryIssuerResponse);
  rpc Issuers(QueryIssuersRequest) returns (QueryIssuersResponse);

  // ---- Quotas ----
  rpc Quota(QueryQuotaRequest) returns (QueryQuotaResponse);
  rpc QuotasByIssuer(QueryQuotasByIssuerRequest) returns (QueryQuotasByIssuerResponse);
  rpc QuotasByDenom(QueryQuotasByDenomRequest) returns (QueryQuotasByDenomResponse);

  // ---- Reserves ----
  rpc Reserve(QueryReserveRequest) returns (QueryReserveResponse);

  // ---- Balances + supply ----
  rpc Balance(QueryBalanceRequest) returns (QueryBalanceResponse);
  rpc Allowance(QueryAllowanceRequest) returns (QueryAllowanceResponse);
  rpc Supply(QuerySupplyRequest) returns (QuerySupplyResponse);

  // ---- Compliance ----
  rpc AccountFlags(QueryAccountFlagsRequest) returns (QueryAccountFlagsResponse);

  // ---- Redemption ----
  rpc Redemption(QueryRedemptionRequest) returns (QueryRedemptionResponse);
  rpc RedemptionsByHolder(QueryRedemptionsByHolderRequest) returns (QueryRedemptionsByHolderResponse);
  rpc PendingRedemptions(QueryPendingRedemptionsRequest) returns (QueryPendingRedemptionsResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

message QueryDenomRequest {
  string id = 1;
}
message QueryDenomResponse {
  Denom denom = 1 [(gogoproto.nullable) = false];
}

message QueryDenomsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
message QueryDenomsResponse {
  repeated Denom denoms = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryIssuerRequest {
  string id = 1;
}
message QueryIssuerResponse {
  Issuer issuer = 1 [(gogoproto.nullable) = false];
}

message QueryIssuersRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
message QueryIssuersResponse {
  repeated Issuer issuers = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryQuotaRequest {
  string issuer_id = 1;
  string denom_id = 2;
}
message QueryQuotaResponse {
  MintQuota quota = 1 [(gogoproto.nullable) = false];
}

message QueryQuotasByIssuerRequest {
  string issuer_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryQuotasByIssuerResponse {
  repeated MintQuota quotas = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryQuotasByDenomRequest {
  string denom_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryQuotasByDenomResponse {
  repeated MintQuota quotas = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryReserveRequest {
  string denom_id = 1;
}
message QueryReserveResponse {
  DenomReserve reserve = 1 [(gogoproto.nullable) = false];
}

message QueryBalanceRequest {
  string denom_id = 1;
  string account = 2;
}
message QueryBalanceResponse {
  uint64 balance = 1;
}

message QueryAllowanceRequest {
  string denom_id = 1;
  string owner = 2;
  string spender = 3;
}
message QueryAllowanceResponse {
  uint64 allowance = 1;
}

message QuerySupplyRequest {
  string denom_id = 1;
}
message QuerySupplyResponse {
  uint64 total_supply = 1;
}

message QueryAccountFlagsRequest {
  string denom_id = 1;
  string account = 2;
}
message QueryAccountFlagsResponse {
  AccountFlags flags = 1 [(gogoproto.nullable) = false];
}

message QueryRedemptionRequest {
  uint64 id = 1;
}
message QueryRedemptionResponse {
  Redemption redemption = 1 [(gogoproto.nullable) = false];
}

message QueryRedemptionsByHolderRequest {
  string holder = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryRedemptionsByHolderResponse {
  repeated Redemption redemptions = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryPendingRedemptionsRequest {
  string denom_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryPendingRedemptionsResponse {
  repeated Redemption redemptions = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

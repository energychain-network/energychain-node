syntax = "proto3";
package energychain.escrow.v1;

import "gogoproto/gogo.proto";

import "energychain/escrow/v1/types.proto";

option go_package = "energychain/x/escrow/types";

message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  uint64 next_escrow_id = 2;
  repeated Escrow escrows = 3 [(gogoproto.nullable) = false];
  repeated Approval approvals = 4 [(gogoproto.nullable) = false];
}

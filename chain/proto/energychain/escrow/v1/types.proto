syntax = "proto3";
package energychain.escrow.v1;

import "gogoproto/gogo.proto";

option go_package = "energychain/x/escrow/types";

// AssetKind labels the value held inside an escrow. The pair
// (stablecoin_denom) or (rwa_token_id) is the natural key — the
// other side is unused.
enum AssetKind {
  ASSET_KIND_UNSPECIFIED = 0;
  ASSET_KIND_STABLECOIN  = 1;
  ASSET_KIND_RWA         = 2;
}

// Status is the escrow lifecycle. Terminal states (RELEASED,
// REFUNDED, CANCELLED) refuse all further actions; DISPUTED is a
// freeze state that allows ResolveDispute → RELEASED / REFUNDED.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_DRAFT       = 1; // created, awaiting Fund
  STATUS_FUNDED      = 2; // funded, awaiting approvals / triggers
  STATUS_DISPUTED    = 3; // frozen by dispute; only arbiter / dispute keeper can move
  STATUS_RELEASED    = 4; // funds delivered to beneficiary
  STATUS_REFUNDED    = 5; // funds returned to fallback
  STATUS_CANCELLED   = 6; // cancelled before funding
}

// Intent is the side an approval signs for. Approvals only count
// toward release / refund threshold checks for the matching intent.
enum Intent {
  INTENT_UNSPECIFIED = 0;
  INTENT_RELEASE     = 1;
  INTENT_REFUND      = 2;
}

// Triggers wraps the optional release-/refund-side preconditions
// beyond signer thresholds. All set fields combine with AND
// semantics; unset fields are ignored.
message Triggers {
  // release_after rejects release until block_time >= release_after.
  // 0 disables.
  int64 release_after = 1;
  // refund_after rejects refund until block_time >= refund_after.
  // 0 disables.
  int64 refund_after = 2;
  // oracle_topic_id, when non-empty, names an x/oracle topic whose
  // latest aggregated value must be >= oracle_min_value before
  // release succeeds. Refund is NOT gated on oracle.
  string oracle_topic_id = 3;
  int64  oracle_min_value = 4;
  // oracle_max_staleness_seconds is the maximum acceptable age
  // (block_time − attestation_time) for the oracle reading. 0
  // disables the freshness check.
  int64  oracle_max_staleness_seconds = 5;
}

// Escrow is one cell of value held inside the module pool, with
// release / refund pre-conditions and an optional arbiter who can
// override the multi-sig.
message Escrow {
  uint64 id = 1;
  string depositor = 2;       // signer of CreateEscrow + Fund
  string beneficiary = 3;     // recipient on Release
  string fallback_addr = 4;   // recipient on Refund / Cancel
  // committee is the multi-sig signer set. Approvals count only
  // when sender is in this list. Renamed from "signers" so the
  // generated MsgCreateEscrow accessor does not collide with the
  // sdk.Msg.GetSigners() interface method we implement by hand.
  repeated string committee = 5;
  // approval_threshold is the minimum number of distinct
  // intent-matching approvals required (in addition to triggers).
  // Must be 0 < threshold <= len(committee).
  uint32 approval_threshold = 6;
  // arbiter, when non-empty, may unilaterally release / refund and
  // mark / resolve a dispute, bypassing approvals AND triggers.
  string arbiter = 7;

  AssetKind kind = 8;
  string stablecoin_denom = 9; // populated iff kind == STABLECOIN
  uint64 rwa_token_id = 10;    // populated iff kind == RWA
  // amount is the original funded amount. It is NOT decremented by
  // partial actions in this version (no milestones); on RELEASED /
  // REFUNDED the full amount is paid out and the row becomes
  // terminal. amount > 0.
  uint64 amount = 11;

  Triggers triggers = 12 [(gogoproto.nullable) = false];

  // approval_count_release / approval_count_refund are the counts
  // collected so far. Approvers are stored individually in the
  // Approval table for audit, but the counter is materialised here
  // for fast read.
  uint32 approval_count_release = 13;
  uint32 approval_count_refund = 14;

  Status status = 15;
  string memo = 16;

  int64 created_at = 17;
  int64 funded_at = 18;
  int64 settled_at = 19;
  int64 disputed_at = 20;
}

// Approval records one signer's intent on an escrow. (escrow_id,
// signer) is unique; intent flips count toward the new side and
// vacate the old side's tally.
message Approval {
  uint64 escrow_id = 1;
  string signer = 2;
  Intent intent = 3;
  int64 approved_at = 4;
  string memo = 5;
}

message Params {
  // max_escrows is the global cap; refuses CreateEscrow once
  // reached. Bounded so a misuse cannot grow state without limit.
  uint32 max_escrows = 1;
  // max_signers_per_escrow caps the multi-sig committee size.
  uint32 max_signers_per_escrow = 2;
  // max_release_horizon_seconds caps how far into the future
  // release_after / refund_after can be set, relative to
  // CreateEscrow's block time. Prevents century-long ghosts.
  int64 max_release_horizon_seconds = 3;
  // require_sanctions_clear applies the address-only blacklist gate
  // to depositor / beneficiary / fallback / arbiter at every state
  // transition that pays them out.
  bool require_sanctions_clear = 4;
}

syntax = "proto3";
package energychain.dispute.v1;

import "gogoproto/gogo.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "energychain/dispute/v1/types.proto";

option go_package = "energychain/x/dispute/types";

service Query {
  rpc Params      (QueryParamsRequest)      returns (QueryParamsResponse);
  rpc Arbitrator  (QueryArbitratorRequest)  returns (QueryArbitratorResponse);
  rpc Arbitrators (QueryArbitratorsRequest) returns (QueryArbitratorsResponse);
  rpc Dispute     (QueryDisputeRequest)     returns (QueryDisputeResponse);
  rpc Disputes    (QueryDisputesRequest)    returns (QueryDisputesResponse);
  rpc Tribunal    (QueryTribunalRequest)    returns (QueryTribunalResponse);
  rpc Votes       (QueryVotesRequest)       returns (QueryVotesResponse);
  rpc Evidence    (QueryEvidenceRequest)    returns (QueryEvidenceResponse);
  rpc PoolAddress (QueryPoolAddressRequest) returns (QueryPoolAddressResponse);
  // AnyOpenDisputeFor lets upstream modules cheaply check
  // whether the supplied (subject_kind, subject_ref) pair
  // currently has an in-flight dispute. Used by contract /
  // oracle / meter to pause settlement.
  rpc AnyOpenDisputeFor(QueryAnyOpenDisputeForRequest) returns (QueryAnyOpenDisputeForResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }

message QueryArbitratorRequest  { uint64 id = 1; }
message QueryArbitratorResponse { Arbitrator arbitrator = 1 [(gogoproto.nullable) = false]; }

message QueryArbitratorsRequest  {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
  ArbitratorStatus status = 2;
}
message QueryArbitratorsResponse {
  repeated Arbitrator arbitrators = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryDisputeRequest  { uint64 id = 1; }
message QueryDisputeResponse { Dispute dispute = 1 [(gogoproto.nullable) = false]; }

message QueryDisputesRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
  DisputeStatus status = 2;
}
message QueryDisputesResponse {
  repeated Dispute disputes = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryTribunalRequest  { uint64 dispute_id = 1; }
message QueryTribunalResponse {
  repeated TribunalMember members = 1 [(gogoproto.nullable) = false];
}

message QueryVotesRequest  { uint64 dispute_id = 1; }
message QueryVotesResponse {
  repeated Vote votes = 1 [(gogoproto.nullable) = false];
}

message QueryEvidenceRequest  { uint64 dispute_id = 1; }
message QueryEvidenceResponse {
  repeated Evidence evidence = 1 [(gogoproto.nullable) = false];
}

message QueryPoolAddressRequest {}
message QueryPoolAddressResponse { string pool = 1; }

message QueryAnyOpenDisputeForRequest {
  SubjectKind subject_kind = 1;
  string subject_ref = 2;
}
message QueryAnyOpenDisputeForResponse {
  bool any = 1;
  uint64 dispute_id = 2; // first id found, 0 if none
}

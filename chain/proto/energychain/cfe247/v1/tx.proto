syntax = "proto3";
package energychain.cfe247.v1;

import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";

import "energychain/cfe247/v1/types.proto";

option go_package = "energychain/x/cfe247/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  // Data provider lifecycle (governance).
  rpc RegisterDataProvider(MsgRegisterDataProvider) returns (MsgRegisterDataProviderResponse);
  rpc UpdateDataProvider(MsgUpdateDataProvider) returns (MsgUpdateDataProviderResponse);
  rpc SuspendDataProvider(MsgSuspendDataProvider) returns (MsgSuspendDataProviderResponse);
  rpc RevokeDataProvider(MsgRevokeDataProvider) returns (MsgRevokeDataProviderResponse);

  // Grid zone registry (governance).
  rpc RegisterGridZone(MsgRegisterGridZone) returns (MsgRegisterGridZoneResponse);
  rpc UpdateGridZone(MsgUpdateGridZone) returns (MsgUpdateGridZoneResponse);
  rpc RemoveGridZone(MsgRemoveGridZone) returns (MsgRemoveGridZoneResponse);

  // Subject lifecycle (subject admin).
  rpc RegisterSubject(MsgRegisterSubject) returns (MsgRegisterSubjectResponse);
  rpc UpdateSubject(MsgUpdateSubject) returns (MsgUpdateSubjectResponse);
  rpc DeactivateSubject(MsgDeactivateSubject) returns (MsgDeactivateSubjectResponse);

  // Hot path: hourly consumption attestation (data provider attestor).
  rpc AttestHourlyConsumption(MsgAttestHourlyConsumption) returns (MsgAttestHourlyConsumptionResponse);
  rpc AttestHourlyConsumptionBatch(MsgAttestHourlyConsumptionBatch) returns (MsgAttestHourlyConsumptionBatchResponse);

  // Hot path: matching EAC retirements to consumption hours (any holder).
  rpc AllocateMatch(MsgAllocateMatch) returns (MsgAllocateMatchResponse);

  // Report generation (subject admin).
  rpc GenerateReport(MsgGenerateReport) returns (MsgGenerateReportResponse);

  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// ---- Data provider --------------------------------------------------------

message MsgRegisterDataProvider {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string did = 3;
  string display_name = 4;
  string attestor = 5;
  string admin = 6;
}
message MsgRegisterDataProviderResponse {}

message MsgUpdateDataProvider {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string display_name = 3;
  string attestor = 4;
  string admin = 5;
}
message MsgUpdateDataProviderResponse {}

message MsgSuspendDataProvider {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string reason = 3;
}
message MsgSuspendDataProviderResponse {}

message MsgRevokeDataProvider {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string reason = 3;
}
message MsgRevokeDataProviderResponse {}

// ---- Grid zone ------------------------------------------------------------

message MsgRegisterGridZone {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string display_name = 3;
  string country = 4;
  string description = 5;
}
message MsgRegisterGridZoneResponse {}

message MsgUpdateGridZone {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string display_name = 3;
  string country = 4;
  string description = 5;
}
message MsgUpdateGridZoneResponse {}

message MsgRemoveGridZone {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
}
message MsgRemoveGridZoneResponse {}

// ---- Subject --------------------------------------------------------------

message MsgRegisterSubject {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;          // anyone can sponsor a subject
  string id = 2;
  string display_name = 3;
  string admin = 4;
  string default_grid_zone = 5;
}
message MsgRegisterSubjectResponse {}

message MsgUpdateSubject {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  string id = 2;
  string display_name = 3;
  string default_grid_zone = 4;
  string new_admin = 5;        // empty to keep
}
message MsgUpdateSubjectResponse {}

message MsgDeactivateSubject {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  string id = 2;
  string reason = 3;
}
message MsgDeactivateSubjectResponse {}

// ---- Consumption attestation ----------------------------------------------

message MsgAttestHourlyConsumption {
  option (cosmos.msg.v1.signer) = "attestor";
  string attestor = 1;          // == DataProvider.attestor
  string data_provider_id = 2;
  string subject_id = 3;
  string grid_zone = 4;
  int64 hour_start = 5;         // hour-aligned
  uint64 wh_consumed = 6;
  string meter_batch_id = 7;
}
message MsgAttestHourlyConsumptionResponse {}

message ConsumptionEntry {
  string subject_id = 1;
  string grid_zone = 2;
  int64 hour_start = 3;
  uint64 wh_consumed = 4;
  string meter_batch_id = 5;
}

message MsgAttestHourlyConsumptionBatch {
  option (cosmos.msg.v1.signer) = "attestor";
  string attestor = 1;
  string data_provider_id = 2;
  repeated ConsumptionEntry entries = 3 [(gogoproto.nullable) = false];
}
message MsgAttestHourlyConsumptionBatchResponse {
  uint32 attested = 1;
}

// ---- Match allocation -----------------------------------------------------

// MsgAllocateMatch credits a slice of an x/eac retirement to a
// (subject, hour) pair. The caller MUST be the retirer of that EAC
// retirement (this anchors authority back to the holder of the
// underlying certificate at retire time).
//
// Cumulative wh across all matches against a single retirement may
// not exceed the retirement's amount.
message MsgAllocateMatch {
  option (cosmos.msg.v1.signer) = "allocator";
  string allocator = 1;
  string subject_id = 2;
  int64 hour_start = 3;
  uint64 eac_retirement_id = 4;
  uint64 wh_matched = 5;
}
message MsgAllocateMatchResponse {
  uint64 match_id = 1;
}

// ---- Report ---------------------------------------------------------------

message MsgGenerateReport {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;            // subject admin
  string subject_id = 2;
  ReportFormat format = 3;
  int64 period_start = 4;
  int64 period_end = 5;
  string report_uri = 6;
  string report_hash = 7;
}
message MsgGenerateReportResponse {
  uint64 report_id = 1;
}

// ---- Params ---------------------------------------------------------------

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

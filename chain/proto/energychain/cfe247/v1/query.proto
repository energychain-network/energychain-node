syntax = "proto3";
package energychain.cfe247.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";

import "energychain/cfe247/v1/types.proto";

option go_package = "energychain/x/cfe247/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);

  rpc DataProvider(QueryDataProviderRequest) returns (QueryDataProviderResponse);
  rpc DataProviders(QueryDataProvidersRequest) returns (QueryDataProvidersResponse);

  rpc GridZone(QueryGridZoneRequest) returns (QueryGridZoneResponse);
  rpc GridZones(QueryGridZonesRequest) returns (QueryGridZonesResponse);

  rpc Subject(QuerySubjectRequest) returns (QuerySubjectResponse);
  rpc Subjects(QuerySubjectsRequest) returns (QuerySubjectsResponse);

  rpc HourlyConsumption(QueryHourlyConsumptionRequest) returns (QueryHourlyConsumptionResponse);
  rpc ConsumptionRange(QueryConsumptionRangeRequest) returns (QueryConsumptionRangeResponse);

  rpc HourlyAggregate(QueryHourlyAggregateRequest) returns (QueryHourlyAggregateResponse);
  rpc AggregateRange(QueryAggregateRangeRequest) returns (QueryAggregateRangeResponse);

  rpc MatchEntry(QueryMatchEntryRequest) returns (QueryMatchEntryResponse);
  rpc MatchesByHour(QueryMatchesByHourRequest) returns (QueryMatchesByHourResponse);

  rpc AnnualScore(QueryAnnualScoreRequest) returns (QueryAnnualScoreResponse);

  rpc Report(QueryReportRequest) returns (QueryReportResponse);
  rpc ReportsBySubject(QueryReportsBySubjectRequest) returns (QueryReportsBySubjectResponse);

  rpc RetirementAllocated(QueryRetirementAllocatedRequest) returns (QueryRetirementAllocatedResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }

message QueryDataProviderRequest { string id = 1; }
message QueryDataProviderResponse { DataProvider provider = 1 [(gogoproto.nullable) = false]; }

message QueryDataProvidersRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryDataProvidersResponse {
  repeated DataProvider providers = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGridZoneRequest { string id = 1; }
message QueryGridZoneResponse { GridZone zone = 1 [(gogoproto.nullable) = false]; }

message QueryGridZonesRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryGridZonesResponse {
  repeated GridZone zones = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QuerySubjectRequest { string id = 1; }
message QuerySubjectResponse { Subject subject = 1 [(gogoproto.nullable) = false]; }

message QuerySubjectsRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QuerySubjectsResponse {
  repeated Subject subjects = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryHourlyConsumptionRequest {
  string subject_id = 1;
  int64 hour_start = 2;
}
message QueryHourlyConsumptionResponse {
  HourlyConsumption consumption = 1 [(gogoproto.nullable) = false];
}

message QueryConsumptionRangeRequest {
  string subject_id = 1;
  int64 hour_start = 2;
  int64 hour_end = 3;             // exclusive
  cosmos.base.query.v1beta1.PageRequest pagination = 4;
}
message QueryConsumptionRangeResponse {
  repeated HourlyConsumption consumptions = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryHourlyAggregateRequest {
  string subject_id = 1;
  int64 hour_start = 2;
}
message QueryHourlyAggregateResponse {
  HourlyAggregate aggregate = 1 [(gogoproto.nullable) = false];
}

message QueryAggregateRangeRequest {
  string subject_id = 1;
  int64 hour_start = 2;
  int64 hour_end = 3;             // exclusive
  cosmos.base.query.v1beta1.PageRequest pagination = 4;
}
message QueryAggregateRangeResponse {
  repeated HourlyAggregate aggregates = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryMatchEntryRequest { uint64 id = 1; }
message QueryMatchEntryResponse { MatchEntry match = 1 [(gogoproto.nullable) = false]; }

message QueryMatchesByHourRequest {
  string subject_id = 1;
  int64 hour_start = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryMatchesByHourResponse {
  repeated MatchEntry matches = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryAnnualScoreRequest {
  string subject_id = 1;
  uint32 year = 2;
}
message QueryAnnualScoreResponse {
  AnnualScore score = 1 [(gogoproto.nullable) = false];
}

message QueryReportRequest { uint64 id = 1; }
message QueryReportResponse { ReportPackage report = 1 [(gogoproto.nullable) = false]; }

message QueryReportsBySubjectRequest {
  string subject_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryReportsBySubjectResponse {
  repeated ReportPackage reports = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryRetirementAllocatedRequest { uint64 eac_retirement_id = 1; }
message QueryRetirementAllocatedResponse { uint64 wh_allocated = 1; }

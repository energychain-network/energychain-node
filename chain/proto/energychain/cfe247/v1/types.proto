syntax = "proto3";
package energychain.cfe247.v1;

import "gogoproto/gogo.proto";

option go_package = "energychain/x/cfe247/types";

enum DataProviderStatus {
  DATA_PROVIDER_STATUS_UNSPECIFIED = 0;
  DATA_PROVIDER_STATUS_ACTIVE      = 1;
  DATA_PROVIDER_STATUS_SUSPENDED   = 2;
  DATA_PROVIDER_STATUS_REVOKED     = 3;
}

enum SubjectStatus {
  SUBJECT_STATUS_UNSPECIFIED = 0;
  SUBJECT_STATUS_ACTIVE      = 1;
  SUBJECT_STATUS_INACTIVE    = 2;
}

// ReportFormat enumerates the supported off-chain report standards.
// The keeper does not parse the report — it only stores the URI and
// hash so a verifier can fetch and check it. The format string is
// also surfaced via events for indexers.
enum ReportFormat {
  REPORT_FORMAT_UNSPECIFIED   = 0;
  REPORT_FORMAT_CFE_COMPACT   = 1; // 24/7 CFE Compact JSON
  REPORT_FORMAT_ENERGYTAG     = 2; // EnergyTag JSON-LD
  REPORT_FORMAT_GHG_PROTOCOL  = 3; // GHG Protocol Scope 2 (annual)
  REPORT_FORMAT_RE100         = 4; // RE100 / Annual matching
}

// DataProvider is a registered attestor of hourly consumption rows.
// In practice this is a metering operator, an aggregator, or an
// internal data engineering service that reads the user's meters.
message DataProvider {
  string id = 1;
  string did = 2;
  string display_name = 3;
  DataProviderStatus status = 4;
  string attestor = 5;     // bech32 that may sign attestations
  string admin = 6;        // bech32 that may rotate the attestor
  string created_by = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

// GridZone is a registered electrical grid balancing area / market
// region. Consumption attestations and EAC certificates carry a
// grid_zone string; the keeper compares them by exact match for the
// "location_matched" credit (the strictest tier in the 24/7 CFE
// Compact). Free-form aliases are deliberately disallowed so the
// chain stays honest about geographical scoping.
message GridZone {
  string id = 1;          // e.g. "DE-LU", "CAISO_NP15", "PJM-AEP"
  string display_name = 2;
  string country = 3;     // ISO 3166 code
  string description = 4;
  int64 created_at = 5;
}

// Subject is the entity whose 24/7 CFE score we compute. Typically
// a data center, factory, retail purchaser, etc.
message Subject {
  string id = 1;
  string display_name = 2;
  SubjectStatus status = 3;
  string admin = 4;            // bech32 that may update / generate reports
  string default_grid_zone = 5;
  string created_by = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

// HourlyConsumption is one (subject, hour) attestation. The hour is
// always exactly 3600 s long. The attestor MUST be the active
// `attestor` address of a registered DataProvider.
message HourlyConsumption {
  string subject_id = 1;
  string grid_zone = 2;
  int64 hour_start = 3;     // unix seconds, MUST be aligned (mod 3600 == 0)
  int64 hour_end = 4;       // == hour_start + 3600
  uint64 wh_consumed = 5;   // watt-hours; integer to avoid float drift
  string data_provider_id = 6;
  string attestor = 7;      // bech32 (snapshot of provider.attestor at attest time)
  string meter_batch_id = 8; // optional reference to x/meter batch / commitment
  int64 attested_at = 9;
}

// MatchEntry pins a slice of consumption (Wh) to one EAC retirement
// row. The keeper enforces:
//   - The retirement exists in x/eac and is owned by the caller.
//   - sum(matched units across this retirement) <= retirement.amount
//   - The certificate's [hour_start, hour_end] interval contains
//     [consumption.hour_start, consumption.hour_end].
//
// Matches that meet `cert.grid_zone == consumption.grid_zone` count
// toward the location_matched_score; matches with non-storage
// technology count toward kwh_matched_with_renewables; matches with
// storage technology count toward kwh_matched_with_storage.
message MatchEntry {
  uint64 id = 1;
  string subject_id = 2;
  int64 hour_start = 3;
  uint64 eac_retirement_id = 4;
  uint64 eac_certificate_id = 5;
  uint64 wh_matched = 6;
  string grid_zone = 7;        // copied from the EAC certificate
  int32 technology = 8;        // x/eac.Technology snapshot
  bool same_zone = 9;          // grid_zone == consumption.grid_zone
  string allocator = 10;       // bech32 that called AllocateMatch
  int64 created_at = 11;
}

// HourlyAggregate is the per-(subject, hour) roll-up. Updated in-
// place by AttestHourlyConsumption / AllocateMatch / RevokeMatch.
//
// The keeper guarantees:
//   wh_matched_total >= wh_matched_same_zone
//   wh_matched_total >= wh_matched_storage
message HourlyAggregate {
  string subject_id = 1;
  int64 hour_start = 2;
  string grid_zone = 3;          // from consumption
  uint64 wh_consumed = 4;
  uint64 wh_matched_total = 5;
  uint64 wh_matched_same_zone = 6;
  uint64 wh_matched_storage = 7; // matches whose technology = STORAGE
  int64 last_updated = 8;
}

// AnnualScore is the per-(subject, year) running roll-up. Years are
// calendar years (UTC) of the consumption hour_start. Stored in
// basis points (10000 = 100.00%).
message AnnualScore {
  string subject_id = 1;
  uint32 year = 2;
  uint64 hours_with_data = 3;
  uint64 hours_fully_matched = 4;
  uint64 total_wh_consumed = 5;
  uint64 total_wh_matched = 6;
  uint64 total_wh_matched_same_zone = 7;
  uint64 total_wh_matched_storage = 8;
  // hourly_score = sum_h(min(matched_h, consumed_h)) / sum_h(consumed_h)
  // The numerator is tracked separately (sum_min_match_consumed)
  // because the per-hour cap can't be reconstructed from the global
  // totals once we cross hour boundaries.
  uint64 sum_min_match_consumed = 9;
  int64 last_updated = 10;
}

message ReportPackage {
  uint64 id = 1;
  string subject_id = 2;
  ReportFormat format = 3;
  int64 period_start = 4;       // unix seconds, hour-aligned
  int64 period_end = 5;         // exclusive
  // Snapshot of scores at the time of generation, in basis points.
  uint32 hourly_score_bps = 6;
  uint32 annual_score_bps = 7;
  uint32 location_matched_score_bps = 8;
  uint64 total_wh_consumed = 9;
  uint64 total_wh_matched = 10;
  uint64 hours_with_data = 11;
  uint64 hours_fully_matched = 12;
  string report_uri = 13;
  string report_hash = 14;       // sha256 hex
  string generated_by = 15;
  int64 generated_at = 16;
}

message Params {
  uint32 max_data_providers = 1;
  uint32 max_grid_zones = 2;
  uint32 max_subjects = 3;
  uint32 max_attestations_per_batch = 4; // for AttestHourlyConsumptionBatch
  uint32 max_matches_per_call = 5;       // for AllocateMatchBatch
  uint32 max_report_period_days = 6;
  // require_active_provider, when true, refuses attestations from
  // provider whose status != ACTIVE. Default true. Toggle off only
  // for emergency catch-up imports.
  bool require_active_provider = 7;
  // hour_seconds is fixed at 3600. Persisted so chain upgrades that
  // ever needed sub-hour matching could change it via governance.
  uint32 hour_seconds = 8;
}

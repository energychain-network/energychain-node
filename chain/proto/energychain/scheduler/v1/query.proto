syntax = "proto3";
package energychain.scheduler.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";

import "energychain/scheduler/v1/types.proto";

option go_package = "energychain/x/scheduler/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);
  rpc Job(QueryJobRequest) returns (QueryJobResponse);
  rpc Jobs(QueryJobsRequest) returns (QueryJobsResponse);
  rpc JobsByOwner(QueryJobsByOwnerRequest) returns (QueryJobsByOwnerResponse);
  rpc DueJobs(QueryDueJobsRequest) returns (QueryDueJobsResponse);
  rpc FeePoolBalance(QueryFeePoolBalanceRequest) returns (QueryFeePoolBalanceResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }

message QueryJobRequest { uint64 id = 1; }
message QueryJobResponse { Job job = 1 [(gogoproto.nullable) = false]; }

message QueryJobsRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryJobsResponse {
  repeated Job jobs = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryJobsByOwnerRequest {
  string owner = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryJobsByOwnerResponse {
  repeated Job jobs = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// DueJobs returns the jobs whose next_run_time <= cutoff_time
// (block_time when cutoff_time is zero). Useful for off-chain
// monitors estimating execution backlog.
message QueryDueJobsRequest {
  int64 cutoff_time = 1;
  uint32 limit = 2;       // 0 -> 100
}
message QueryDueJobsResponse {
  repeated Job jobs = 1 [(gogoproto.nullable) = false];
}

message QueryFeePoolBalanceRequest {
  string fee_denom = 1;
}
message QueryFeePoolBalanceResponse {
  string fee_pool = 1;
  uint64 balance = 2;
}

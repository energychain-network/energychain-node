syntax = "proto3";
package energychain.scheduler.v1;

import "gogoproto/gogo.proto";
import "google/protobuf/any.proto";

option go_package = "energychain/x/scheduler/types";

// Status is the job lifecycle.
//
// ACTIVE     — scheduled to run; EndBlocker may fire it.
// PAUSED     — owner-requested halt; budget retained; can be resumed.
// EXHAUSTED  — either the budget cannot cover the next fee, the
//              max_executions cap is reached, or end_time has
//              passed. Owner may TopUp + Resume to revive (subject
//              to status reset rules — see msg_server).
// CANCELLED  — terminal; remaining budget is refundable via Withdraw.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE      = 1;
  STATUS_PAUSED      = 2;
  STATUS_EXHAUSTED   = 3;
  STATUS_CANCELLED   = 4;
}

// Job is one scheduled recurring action.
//
// Execution model:
//   - The job runs first at start_time.
//   - Each subsequent run is at start_time + i*interval_seconds.
//   - EndBlocker advances next_run_time using the
//     "catch-up" rule: it computes the next future run from the
//     current block time, so a long downtime does not result in
//     a burst of back-to-back catch-up executions.
//   - max_executions = 0 means "no cap".
//   - end_time = 0 means "no deadline".
//
// Fee model:
//   - fee_budget is a credit in fee_denom held in the
//     scheduler fee pool (a deterministic module account).
//   - fee_per_run is debited at every execution attempt — success
//     and failure both consume the fee (mirrors L1 gas), preventing
//     pathological always-failing payloads from running for free.
//   - When budget < fee_per_run the job transitions to EXHAUSTED
//     before the would-be execution.
message Job {
  uint64 id = 1;
  string owner = 2;

  // payload is the message that runs on every tick. Its
  // GetSigners() MUST return exactly the job owner at create /
  // update time — re-validated then so callers cannot smuggle
  // foreign-signer messages through the scheduler. The
  // type_url identifies the proto Msg type registered in the
  // interface registry.
  google.protobuf.Any payload = 3;

  int64  start_time = 4;
  int64  end_time   = 5;
  int64  interval_seconds = 6;
  uint64 max_executions   = 7;

  int64  next_run_time   = 8;
  uint64 executions_done = 9;
  uint64 successes       = 10;
  uint64 failures        = 11;

  string fee_denom    = 12;
  uint64 fee_per_run  = 13;
  uint64 fee_budget   = 14;
  uint64 fees_spent   = 15;

  Status status = 16;

  // last_error / last_*_time are observability fields. last_error
  // is truncated to ErrorMaxLen so a verbose handler error cannot
  // bloat state. last_*_time = 0 means "never".
  string last_error      = 17;
  int64  last_error_time = 18;
  int64  last_success_time = 19;

  int64 created_at = 20;
  string memo = 21;
}

message Params {
  // max_jobs caps total live job rows. Sized so a misconfigured
  // controller cannot grow the state without bound.
  uint32 max_jobs = 1;
  // max_jobs_per_owner caps a single owner's footprint. Defends
  // against one bad citizen filling the scheduler.
  uint32 max_jobs_per_owner = 2;
  // min_interval_seconds is the floor on tick frequency, sized
  // larger than the block time so the EndBlocker never has to
  // double-run a single job.
  int64 min_interval_seconds = 3;
  // max_interval_seconds is the ceiling, keeping next_run_time
  // bounded and the by-time index sortable.
  int64 max_interval_seconds = 4;
  // max_payload_bytes caps the serialized payload size. 0 = use
  // the hard-coded ceiling.
  uint32 max_payload_bytes = 5;
  // max_jobs_per_block is the EndBlocker fairness cap. Once
  // reached we stop and pick up the rest the next block. Sized
  // smaller than the chain's expected per-block compute budget.
  uint32 max_jobs_per_block = 6;
  // default_fee_denom is the stablecoin denom used when a
  // CreateJob omits fee_denom. Empty disables the default and
  // CreateJob must specify a denom.
  string default_fee_denom = 7;
  // fee_collector is the address that receives consumed fees.
  // Empty means "burn" (the pool retains the spent fees forever).
  // For production set this to the chain's standard fee collector
  // module address.
  string fee_collector = 8;
  // error_max_len caps the per-job last_error string length.
  uint32 error_max_len = 9;
}

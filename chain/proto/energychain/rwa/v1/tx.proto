syntax = "proto3";
package energychain.rwa.v1;

import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";

import "energychain/rwa/v1/types.proto";

option go_package = "energychain/x/rwa/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  // Issuer lifecycle (governance).
  rpc RegisterIssuer(MsgRegisterIssuer) returns (MsgRegisterIssuerResponse);
  rpc UpdateIssuer(MsgUpdateIssuer) returns (MsgUpdateIssuerResponse);
  rpc SuspendIssuer(MsgSuspendIssuer) returns (MsgSuspendIssuerResponse);
  rpc RevokeIssuer(MsgRevokeIssuer) returns (MsgRevokeIssuerResponse);

  // Token lifecycle (issuer admin).
  rpc CreateToken(MsgCreateToken) returns (MsgCreateTokenResponse);
  rpc UpdateToken(MsgUpdateToken) returns (MsgUpdateTokenResponse);
  rpc PauseToken(MsgPauseToken) returns (MsgPauseTokenResponse);
  rpc UnpauseToken(MsgUnpauseToken) returns (MsgUnpauseTokenResponse);
  rpc TerminateToken(MsgTerminateToken) returns (MsgTerminateTokenResponse);

  // Compliance flags (issuer admin).
  rpc SetAccountFlags(MsgSetAccountFlags) returns (MsgSetAccountFlagsResponse);

  // Mint / burn (issuer authority).
  rpc Mint(MsgMint) returns (MsgMintResponse);
  rpc Burn(MsgBurn) returns (MsgBurnResponse);

  // Hot path.
  rpc Transfer(MsgTransfer) returns (MsgTransferResponse);
  rpc ForceTransfer(MsgForceTransfer) returns (MsgForceTransferResponse);

  // Freeze / lockup (issuer authority).
  rpc SetFrozenBalance(MsgSetFrozenBalance) returns (MsgSetFrozenBalanceResponse);
  rpc AddLockup(MsgAddLockup) returns (MsgAddLockupResponse);

  // Snapshot + distribution.
  rpc TakeSnapshot(MsgTakeSnapshot) returns (MsgTakeSnapshotResponse);
  rpc CreateDistribution(MsgCreateDistribution) returns (MsgCreateDistributionResponse);
  rpc FundDistribution(MsgFundDistribution) returns (MsgFundDistributionResponse);
  rpc ClaimDistribution(MsgClaimDistribution) returns (MsgClaimDistributionResponse);
  rpc FinalizeDistribution(MsgFinalizeDistribution) returns (MsgFinalizeDistributionResponse);

  // Redemption queue.
  rpc RequestRedemption(MsgRequestRedemption) returns (MsgRequestRedemptionResponse);
  rpc SettleRedemption(MsgSettleRedemption) returns (MsgSettleRedemptionResponse);
  rpc CancelRedemption(MsgCancelRedemption) returns (MsgCancelRedemptionResponse);

  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// ---- Issuer ---------------------------------------------------------------

message MsgRegisterIssuer {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string did = 3;
  string display_name = 4;
  string issuer_authority = 5;
  string issuer_admin = 6;
}
message MsgRegisterIssuerResponse {}

message MsgUpdateIssuer {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string display_name = 3;
  string issuer_authority = 4;
  string issuer_admin = 5;
}
message MsgUpdateIssuerResponse {}

message MsgSuspendIssuer {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string reason = 3;
}
message MsgSuspendIssuerResponse {}

message MsgRevokeIssuer {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string reason = 3;
}
message MsgRevokeIssuerResponse {}

// ---- Token ----------------------------------------------------------------

message MsgCreateToken {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;             // issuer admin
  string issuer_id = 2;
  string symbol = 3;
  string display_name = 4;
  uint32 decimals = 5;
  AssetClass asset_class = 6;
  string jurisdiction = 7;
  string policy_id = 8;
  string settlement_denom = 9;
  uint64 per_holder_cap = 10;
  uint64 total_supply_cap = 11;
  uint64 redemption_rate = 12;
  int64 redemption_delay_seconds = 13;
  bool require_kyc_holders = 14;
}
message MsgCreateTokenResponse {
  uint64 token_id = 1;
}

message MsgUpdateToken {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  string display_name = 3;
  string policy_id = 4;
  uint64 per_holder_cap = 5;
  uint64 redemption_rate = 6;
  int64 redemption_delay_seconds = 7;
  bool require_kyc_holders = 8;
  bool set_kyc_flag = 9;        // require_kyc_holders is interpreted only when set_kyc_flag=true
}
message MsgUpdateTokenResponse {}

message MsgPauseToken {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  string reason = 3;
}
message MsgPauseTokenResponse {}

message MsgUnpauseToken {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  string reason = 3;
}
message MsgUnpauseTokenResponse {}

message MsgTerminateToken {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  string reason = 3;
}
message MsgTerminateTokenResponse {}

// ---- Account flags --------------------------------------------------------

message MsgSetAccountFlags {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  string account = 3;
  bool kyc_cleared = 4;
  bool accredited = 5;
  string jurisdiction = 6;
}
message MsgSetAccountFlagsResponse {}

// ---- Mint / burn ----------------------------------------------------------

message MsgMint {
  option (cosmos.msg.v1.signer) = "issuer_authority";
  string issuer_authority = 1;
  uint64 token_id = 2;
  string recipient = 3;
  uint64 amount = 4;
  string memo = 5;
}
message MsgMintResponse {
  uint64 new_supply = 1;
}

message MsgBurn {
  option (cosmos.msg.v1.signer) = "issuer_authority";
  string issuer_authority = 1;
  uint64 token_id = 2;
  string from = 3;              // any holder; issuer-authority can burn
  uint64 amount = 4;
  string reason = 5;
}
message MsgBurnResponse {
  uint64 new_supply = 1;
}

// ---- Transfer -------------------------------------------------------------

message MsgTransfer {
  option (cosmos.msg.v1.signer) = "from";
  string from = 1;
  string to = 2;
  uint64 token_id = 3;
  uint64 amount = 4;
  string memo = 5;
}
message MsgTransferResponse {}

message MsgForceTransfer {
  option (cosmos.msg.v1.signer) = "issuer_authority";
  string issuer_authority = 1;
  uint64 token_id = 2;
  string from = 3;
  string to = 4;
  uint64 amount = 5;
  string reason = 6;
}
message MsgForceTransferResponse {}

// ---- Freeze / lockup ------------------------------------------------------

message MsgSetFrozenBalance {
  option (cosmos.msg.v1.signer) = "issuer_authority";
  string issuer_authority = 1;
  uint64 token_id = 2;
  string account = 3;
  uint64 amount = 4;
  string reason = 5;
}
message MsgSetFrozenBalanceResponse {}

message MsgAddLockup {
  option (cosmos.msg.v1.signer) = "issuer_authority";
  string issuer_authority = 1;
  uint64 token_id = 2;
  string account = 3;
  uint64 amount = 4;
  int64 unlock_time = 5;
  string reason = 6;
}
message MsgAddLockupResponse {
  uint64 lockup_id = 1;
}

// ---- Snapshot / distribution ---------------------------------------------

message MsgTakeSnapshot {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
}
message MsgTakeSnapshotResponse {
  uint64 snapshot_id = 1;
  uint64 holder_count = 2;
  uint64 total_supply = 3;
}

message MsgCreateDistribution {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;             // issuer admin
  uint64 token_id = 2;
  uint64 snapshot_id = 3;
  uint64 total_amount = 4;      // settlement_denom units
  string memo = 5;
}
message MsgCreateDistributionResponse {
  uint64 distribution_id = 1;
  uint64 per_unit_rate = 2;     // scaled by 1e12
}

message MsgFundDistribution {
  option (cosmos.msg.v1.signer) = "issuer_authority";
  string issuer_authority = 1;  // settlement_denom payer
  uint64 distribution_id = 2;
}
message MsgFundDistributionResponse {}

message MsgClaimDistribution {
  option (cosmos.msg.v1.signer) = "claimer";
  string claimer = 1;
  uint64 distribution_id = 2;
}
message MsgClaimDistributionResponse {
  uint64 amount = 1;
}

message MsgFinalizeDistribution {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;             // issuer admin
  uint64 distribution_id = 2;
}
message MsgFinalizeDistributionResponse {
  uint64 swept_back = 1;        // settlement_denom units returned to issuer
}

// ---- Redemption -----------------------------------------------------------

message MsgRequestRedemption {
  option (cosmos.msg.v1.signer) = "holder";
  string holder = 1;
  uint64 token_id = 2;
  uint64 amount = 3;
  string memo = 4;
}
message MsgRequestRedemptionResponse {
  uint64 redemption_id = 1;
  uint64 settlement_amount = 2;
  int64 eligible_at = 3;
}

message MsgSettleRedemption {
  option (cosmos.msg.v1.signer) = "issuer_authority";
  string issuer_authority = 1;
  uint64 redemption_id = 2;
}
message MsgSettleRedemptionResponse {}

message MsgCancelRedemption {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;             // holder OR issuer_authority
  uint64 redemption_id = 2;
  string reason = 3;
}
message MsgCancelRedemptionResponse {}

// ---- Params ---------------------------------------------------------------

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

syntax = "proto3";
package energychain.meter.v1;

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

import "energychain/meter/v1/types.proto";

option go_package = "energychain/x/meter/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc RegisterMeteringPoint(MsgRegisterMeteringPoint) returns (MsgRegisterMeteringPointResponse);
  rpc UpdateMeteringPoint(MsgUpdateMeteringPoint) returns (MsgUpdateMeteringPointResponse);
  rpc DeactivateMeteringPoint(MsgDeactivateMeteringPoint) returns (MsgDeactivateMeteringPointResponse);

  rpc SubmitReading(MsgSubmitReading) returns (MsgSubmitReadingResponse);
  rpc SubmitBatch(MsgSubmitBatch) returns (MsgSubmitBatchResponse);

  rpc AuthorizeStream(MsgAuthorizeStream) returns (MsgAuthorizeStreamResponse);
  rpc RevokeStream(MsgRevokeStream) returns (MsgRevokeStreamResponse);

  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgRegisterMeteringPoint {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  // Body fields are mirrored from MeteringPoint; chain rewrites
  // registered_at / updated_at / active.
  string id = 2;
  string device_did = 3;
  string owner_address = 4;
  string grid_zone = 5;
  string grid_operator = 6;
  string tariff = 7;
  MeasurementType measurement_type = 8;
  string unit = 9;
  string timezone = 10;
  string metadata_uri = 11;
}
message MsgRegisterMeteringPointResponse {}

message MsgUpdateMeteringPoint {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string id = 2;
  // Mutable subset; chain rejects attempts to rewrite owner_address /
  // device_did via this message — those require explicit governance to
  // preserve auditability.
  string grid_zone = 3;
  string grid_operator = 4;
  string tariff = 5;
  string unit = 6;
  string timezone = 7;
  string metadata_uri = 8;
}
message MsgUpdateMeteringPointResponse {}

message MsgDeactivateMeteringPoint {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string id = 2;
  string reason = 3;
}
message MsgDeactivateMeteringPointResponse {}

message MsgSubmitReading {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string metering_point_id = 2;
  ReadingPeriod period = 3;
  int64 start_time = 4;
  int64 end_time = 5;
  CommitmentScheme commitment_scheme = 6;
  bytes commitment_bytes = 7;
  int64 plaintext_value = 8;
  bytes device_signature = 9;
  DataQualityFlag data_quality = 10;
}
message MsgSubmitReadingResponse {}

// MsgSubmitBatch records a Merkle-rooted bundle. The server emits a
// canonical batch id derived from (height, submitter, merkle_root) so a
// resubmission of the exact same bundle yields the same id (idempotent
// for genuine retries; collisions across distinct submitters are
// impossible because the submitter is part of the digest).
message MsgSubmitBatch {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string metering_point_id = 2;
  string merkle_root = 3;
  string merkle_algorithm = 4;
  uint32 count = 5;
  ReadingPeriod period = 6;
  int64 start_time = 7;
  int64 end_time = 8;
  string uri = 9;
  bytes device_signature = 10;
}
message MsgSubmitBatchResponse {
  string batch_id = 1;
}

message MsgAuthorizeStream {
  option (cosmos.msg.v1.signer) = "authorizer";
  string authorizer = 1;
  string metering_point_id = 2;
  string device_did = 3;
  int64 expires_at = 4;
  string metadata = 5;
}
message MsgAuthorizeStreamResponse {
  string id = 1;
}

message MsgRevokeStream {
  option (cosmos.msg.v1.signer) = "authorizer";
  string authorizer = 1;
  string id = 2;
  string reason = 3;
}
message MsgRevokeStreamResponse {}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

syntax = "proto3";
package energychain.streampay.v1;

import "gogoproto/gogo.proto";

import "energychain/streampay/v1/types.proto";

option go_package = "energychain/x/streampay/types";

message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  uint64 next_stream_id = 2;
  repeated Stream streams = 3 [(gogoproto.nullable) = false];
}

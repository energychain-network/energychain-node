syntax = "proto3";
package energychain.streampay.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";

import "energychain/streampay/v1/types.proto";

option go_package = "energychain/x/streampay/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);
  rpc Stream(QueryStreamRequest) returns (QueryStreamResponse);
  rpc Streams(QueryStreamsRequest) returns (QueryStreamsResponse);
  rpc StreamsBySender(QueryStreamsBySenderRequest) returns (QueryStreamsBySenderResponse);
  rpc StreamsByReceiver(QueryStreamsByReceiverRequest) returns (QueryStreamsByReceiverResponse);
  // Withdrawable is the live per-second accrual read receivers
  // poll off-chain to know how much they can pull in the next
  // MsgWithdraw without re-running the full math themselves.
  rpc Withdrawable(QueryWithdrawableRequest) returns (QueryWithdrawableResponse);
  rpc PoolAddress(QueryPoolAddressRequest) returns (QueryPoolAddressResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }

message QueryStreamRequest { uint64 id = 1; }
message QueryStreamResponse { Stream stream = 1 [(gogoproto.nullable) = false]; }

message QueryStreamsRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryStreamsResponse {
  repeated Stream streams = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryStreamsBySenderRequest {
  string sender = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryStreamsBySenderResponse {
  repeated Stream streams = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryStreamsByReceiverRequest {
  string receiver = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryStreamsByReceiverResponse {
  repeated Stream streams = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryWithdrawableRequest {
  uint64 stream_id = 1;
  // at_time = 0 means "use current block_time".
  int64 at_time = 2;
}
message QueryWithdrawableResponse {
  uint64 withdrawable = 1;
  uint64 streamed_total = 2;
  uint64 deposit = 3;
}

message QueryPoolAddressRequest {}
message QueryPoolAddressResponse { string pool = 1; }

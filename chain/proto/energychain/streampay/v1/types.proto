syntax = "proto3";
package energychain.streampay.v1;

import "gogoproto/gogo.proto";

option go_package = "energychain/x/streampay/types";

// Status is the stream lifecycle.
//
// ACTIVE     — flowing; receiver can Withdraw any unclaimed
//              streamed portion.
// PAUSED     — flow halted at paused_at; previously accrued (not
//              yet withdrawn) portion is still withdrawable, but
//              no further accrual happens until Resume.
// CANCELLED  — sender / receiver terminated the stream. Final
//              settlement (receiver gets streamed-not-withdrawn,
//              sender gets the unstreamed deposit) is performed
//              atomically on CancelStream; status is terminal.
// COMPLETED  — end_time has passed and the stream is fully
//              streamed-out and the receiver has drained the
//              accrual. Status flips to COMPLETED only when a
//              Withdraw consumes the last sat AND end_time has
//              passed. (Lazy completion — we don't run an
//              EndBlocker for this; status is informational.)
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE      = 1;
  STATUS_PAUSED      = 2;
  STATUS_CANCELLED   = 3;
  STATUS_COMPLETED   = 4;
}

// Stream is a single per-second payment flow.
//
// Accounting model:
//   - sender funds `deposit` into the streampay pool at create.
//   - rate_per_second is the accrual rate while ACTIVE.
//   - streamed(now) = min(elapsed_active_seconds * rate, deposit)
//     where elapsed_active_seconds excludes all paused intervals.
//   - withdrawable(now) = streamed(now) - withdrawn.
//   - Withdraw debits the pool and credits the receiver by
//     exactly withdrawable(now) (or a smaller amount when the
//     receiver requests a partial withdraw).
//   - CancelStream settles: receiver gets streamed-not-withdrawn,
//     sender gets deposit-streamed (the unstreamed runway).
//
// Field-level invariants enforced by the keeper:
//   - withdrawn <= streamed(now) <= deposit
//   - paused_accumulated_seconds >= 0
//   - end_time == 0 || end_time > start_time
//   - rate_per_second > 0
message Stream {
  uint64 id = 1;
  string sender = 2;
  string receiver = 3;
  // denom is the stablecoin denom held in the streampay pool
  // for this stream. Immutable post-create.
  string denom = 4;
  uint64 rate_per_second = 5;
  // deposit is the original pre-funded amount. Mutable only via
  // DepositToStream (adds to it) and CancelStream (zeroes on
  // settlement).
  uint64 deposit = 6;
  uint64 withdrawn = 7;
  int64 start_time = 8;
  // end_time = 0 means "open-ended"; the stream runs until
  // CancelStream is called or the deposit is exhausted.
  int64 end_time = 9;
  // paused_at = 0 means "not currently paused".
  int64 paused_at = 10;
  // paused_accumulated_seconds is the running sum of all
  // completed pause intervals' durations. The in-flight pause
  // interval (when status == PAUSED) is added on-the-fly during
  // accrual computation, not materialised here, so an aborted
  // node has the same view as a long-running one.
  int64 paused_accumulated_seconds = 11;
  Status status = 12;
  int64 created_at = 13;
  int64 settled_at = 14;
  string memo = 15;
}

message Params {
  // max_streams caps total live stream rows. We never delete
  // streams (audit trail), so this is a lifetime-creates cap.
  uint32 max_streams = 1;
  uint32 max_streams_per_sender = 2;
  // min_rate_per_second is the floor (must be >= 1).
  uint64 min_rate_per_second = 3;
  // max_rate_per_second prevents absurd per-second debits. Sized
  // so rate * max_horizon_seconds < 2^63 even when deposit is at
  // the per-stream cap.
  uint64 max_rate_per_second = 4;
  // max_deposit caps the per-stream initial + top-up deposit.
  uint64 max_deposit = 5;
  // max_horizon_seconds bounds end_time - start_time. Open-ended
  // streams (end_time = 0) are still allowed but their effective
  // horizon is bounded by deposit / rate.
  int64 max_horizon_seconds = 6;
  // default_denom is the stablecoin denom used when CreateStream
  // omits denom. Empty means "no default — caller must specify".
  string default_denom = 7;
  // memo_max_len caps the per-stream memo length.
  uint32 memo_max_len = 8;
}

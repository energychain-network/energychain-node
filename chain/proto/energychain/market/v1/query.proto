syntax = "proto3";
package energychain.market.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "energychain/market/v1/types.proto";

option go_package = "energychain/x/market/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);
  rpc Market(QueryMarketRequest) returns (QueryMarketResponse);
  rpc Markets(QueryMarketsRequest) returns (QueryMarketsResponse);
  rpc Order(QueryOrderRequest) returns (QueryOrderResponse);
  rpc Orders(QueryOrdersRequest) returns (QueryOrdersResponse);
  rpc OrderBook(QueryOrderBookRequest) returns (QueryOrderBookResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }

message QueryMarketRequest { uint64 id = 1; }
message QueryMarketResponse { Market market = 1 [(gogoproto.nullable) = false]; }

message QueryMarketsRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryMarketsResponse {
  repeated Market markets = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryOrderRequest { uint64 id = 1; }
message QueryOrderResponse { Order order = 1 [(gogoproto.nullable) = false]; }

message QueryOrdersRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryOrdersResponse {
  repeated Order orders = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// OrderBook returns the open buy and sell orders for a market.
message QueryOrderBookRequest { uint64 market_id = 1; }
message QueryOrderBookResponse {
  repeated Order buys = 1 [(gogoproto.nullable) = false];
  repeated Order sells = 2 [(gogoproto.nullable) = false];
}

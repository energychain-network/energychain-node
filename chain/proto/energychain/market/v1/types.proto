syntax = "proto3";
package energychain.market.v1;

import "gogoproto/gogo.proto";

option go_package = "energychain/x/market/types";

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY         = 1;
  ORDER_SIDE_SELL        = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_OPEN        = 1; // resting on the book
  ORDER_STATUS_FILLED      = 2; // fully matched (terminal)
  ORDER_STATUS_CANCELLED   = 3; // withdrawn by owner (terminal)
}

enum MarketStatus {
  MARKET_STATUS_UNSPECIFIED  = 0;
  MARKET_STATUS_ACTIVE       = 1; // accepts orders, clears batches
  MARKET_STATUS_PAUSED       = 2; // no new orders / no clearing; cancels allowed
  MARKET_STATUS_PENDING_BOND = 3; // created by governance, waiting for the
                                  // operator to post the listing bond
  MARKET_STATUS_DELISTED     = 4; // terminal: orders cancelled, bond refunded
}

// Market is a trading pair over two x/stableusd settlement denoms cleared by a
// frequent batch auction. Price is quote micro-units per 1 base unit, scaled by
// PriceScale (1e6): quote_notional = price * base_qty / PriceScale.
message Market {
  uint64 id = 1;
  string base_denom = 2;
  string quote_denom = 3;
  MarketStatus status = 4;
  uint32 fee_bps = 5;              // protocol fee on the cleared quote leg
  uint64 min_base_qty = 6;         // minimum order quantity (lot floor)
  int64 batch_interval = 7;        // seconds between batch clears
  int64 last_batch_time = 8;       // unix time of the last clear
  uint64 last_clearing_price = 9;  // last uniform clearing price (0 if none)
  int64 created_at = 10;
  bool require_kyc = 11;           // order owners must be KYC-cleared (x/identity)
  string policy_id = 12;           // bound x/identity transfer policy (optional)

  // operator is the account responsible for the listing (for rwa/<id>
  // markets it must be the token's admin, i.e. the issuer). Only the
  // operator may post the listing bond, and the bond is refunded to the
  // operator when governance delists the market.
  string operator = 13;
  // bond_amount/bond_denom record what was actually escrowed at post time
  // so later governance changes to params.listing_bond never affect the
  // refund of already-listed markets.
  string bond_amount = 14 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  string bond_denom = 15;
}

// Order is a resting limit order. For BUY, `escrowed` holds quote_denom; for
// SELL it holds base_denom. `seq` is the global monotonic placement sequence
// used for deterministic price-time priority.
message Order {
  uint64 id = 1;
  uint64 market_id = 2;
  string owner = 3;
  OrderSide side = 4;
  uint64 price = 5;        // quote per base, PriceScale-scaled
  uint64 quantity = 6;     // total base units
  uint64 filled = 7;       // base units already matched
  uint64 escrowed = 8;     // remaining escrow (quote for BUY, base for SELL)
  OrderStatus status = 9;
  int64 created_at = 10;
  uint64 seq = 11;
}

message Params {
  uint32 max_markets = 1;
  uint32 max_open_orders_per_market = 2;
  uint32 max_fills_per_batch = 3;     // bound on per-market work in EndBlocker
  uint32 max_fee_bps = 4;             // cap on a market's fee_bps
  int64 min_batch_interval = 5;       // floor on a market's batch_interval (secs)
  bool paused = 6;                    // global kill switch

  // listing_bond is the amount of listing_bond_denom the market operator
  // must escrow (MsgPostBond) before a newly created market opens for
  // trading. It is refunded in full when governance delists the market.
  // 0 disables the bond gate (markets activate immediately). Governance
  // tunes it via MsgUpdateParams; changes only apply to future bonds.
  string listing_bond = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  string listing_bond_denom = 8; // e.g. "uecy" (native staking denom)
}

syntax = "proto3";
package energychain.market.v1;

import "gogoproto/gogo.proto";
import "energychain/market/v1/types.proto";

option go_package = "energychain/x/market/types";

message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated Market markets = 2 [(gogoproto.nullable) = false];
  repeated Order orders = 3 [(gogoproto.nullable) = false];
  uint64 market_id_seq = 4;
  uint64 order_id_seq = 5;
  uint64 order_placement_seq = 6;
}

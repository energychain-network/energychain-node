syntax = "proto3";
package energychain.market.v1;

import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";
import "energychain/market/v1/types.proto";

option go_package = "energychain/x/market/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc CreateMarket(MsgCreateMarket) returns (MsgCreateMarketResponse);
  rpc SetMarketStatus(MsgSetMarketStatus) returns (MsgSetMarketStatusResponse);
  rpc PlaceOrder(MsgPlaceOrder) returns (MsgPlaceOrderResponse);
  rpc CancelOrder(MsgCancelOrder) returns (MsgCancelOrderResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  rpc PostBond(MsgPostBond) returns (MsgPostBondResponse);
  rpc DelistMarket(MsgDelistMarket) returns (MsgDelistMarketResponse);
}

// CreateMarket / SetMarketStatus are authority-gated (governance).
message MsgCreateMarket {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string base_denom = 2;
  string quote_denom = 3;
  uint32 fee_bps = 4;
  uint64 min_base_qty = 5;
  int64 batch_interval = 6;
  bool require_kyc = 7;   // order owners must be KYC-cleared (optional)
  string policy_id = 8;   // bound x/identity transfer policy (optional)

  // operator posts the listing bond and receives its refund on delisting.
  // For rwa/<id> markets it must be the token's admin (the issuer).
  // Required when params.listing_bond > 0.
  string operator = 9;
}
message MsgCreateMarketResponse { uint64 market_id = 1; }

message MsgSetMarketStatus {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  uint64 market_id = 2;
  MarketStatus status = 3;
}
message MsgSetMarketStatusResponse {}

// PlaceOrder escrows quote (BUY) or base (SELL) and rests the order for the
// next batch auction.
message MsgPlaceOrder {
  option (cosmos.msg.v1.signer) = "owner";
  string owner = 1;
  uint64 market_id = 2;
  OrderSide side = 3;
  uint64 price = 4;
  uint64 quantity = 5;
}
message MsgPlaceOrderResponse { uint64 order_id = 1; }

// CancelOrder withdraws an open order and refunds its remaining escrow.
message MsgCancelOrder {
  option (cosmos.msg.v1.signer) = "owner";
  string owner = 1;
  uint64 order_id = 2;
}
message MsgCancelOrderResponse { uint64 refunded = 1; }

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

// ---- listing bond ----------------------------------------------------------

// PostBond escrows params.listing_bond from the market operator into the
// market module account and opens the market for trading
// (PENDING_BOND -> ACTIVE). Only the designated operator may post.
message MsgPostBond {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1;
  uint64 market_id = 2;
}
message MsgPostBondResponse {
  string amount = 1; // escrowed amount (base units)
  string denom = 2;
}

// DelistMarket (governance) cancels every open order with a full escrow
// refund, refunds the listing bond to the operator and puts the market in
// the terminal DELISTED state.
message MsgDelistMarket {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  uint64 market_id = 2;
}
message MsgDelistMarketResponse {
  uint32 cancelled_orders = 1;
  string refunded = 2; // bond amount returned to the operator
}

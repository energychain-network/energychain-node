syntax = "proto3";
package energychain.oracle.v1;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";

option go_package = "energychain/x/oracle/types";

// TopicKind classifies a Topic's payload semantics. The chain treats the
// raw value as opaque scaled int64; the kind only affects how clients
// render and how the aggregator picks a default outlier band.
enum TopicKind {
  TOPIC_KIND_GENERIC = 0;
  TOPIC_KIND_PRICE = 1;     // power.spot.PJM.WHUB, etc — quoted in Quote
  TOPIC_KIND_FX = 2;        // EURUSD, etc
  TOPIC_KIND_CARBON = 3;    // EUA.dec25
  TOPIC_KIND_RESERVE = 4;   // PoR backing — typically not aggregated
  TOPIC_KIND_WEATHER = 5;
  TOPIC_KIND_INDEX = 6;     // composite indices
}

// AggregationFn picks the deterministic, on-chain aggregation. We keep
// the set small and audited; consumers that need bespoke math should
// register a separate Topic and consume the raw submissions.
enum AggregationFn {
  AGG_MEDIAN = 0;             // sorted middle element (default; outlier-resilient)
  AGG_MEAN = 1;               // arithmetic mean (after outlier cull)
  AGG_TRIMMED_MEAN = 2;       // mean after dropping top/bottom 1
  AGG_MEDIAN_OF_MEDIANS = 3;  // groups of 5 then median; robust under colluding minorities
}

// Topic is the first-class data stream identifier. Every push / pull
// flows through a Topic, and every aggregation result is keyed by it.
//
// outlier_band_bps: basis points (1/10000ths). When >0 the aggregator
// drops submissions whose value lies outside median ± band. Set 0 to
// disable outlier filtering (NOT recommended for price feeds).
//
// max_data_age_seconds: submissions older than this at aggregation time
// are ignored. Defaults to 0 == no age check (strongly discouraged for
// fast-moving feeds).
//
// allow_list non-empty restricts which providers may submit; empty
// allow_list means "any active, non-suspended, non-restricted provider".
message Topic {
  string id = 1;
  string description = 2;
  TopicKind kind = 3;
  AggregationFn aggregation = 4;
  uint32 min_submissions = 5;
  int64 max_data_age_seconds = 6;
  uint32 outlier_band_bps = 7;
  uint32 value_decimals = 8;
  string quote = 9;
  bool paused = 10;
  bool enabled = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
  // allow_list optionally restricts which provider addresses (bech32) may
  // submit values to this topic. Empty list ⇒ open to all active providers.
  repeated string allow_list = 14;
}

// ProviderStatus is the lifecycle of an oracle data provider's bond.
enum ProviderStatus {
  PROVIDER_STATUS_UNSPECIFIED = 0;
  PROVIDER_STATUS_ACTIVE = 1;
  PROVIDER_STATUS_SUSPENDED = 2;
  PROVIDER_STATUS_WITHDRAWING = 3;
  PROVIDER_STATUS_RETIRED = 4;
}

// Provider records a registered data provider's bond and access rights.
//
// bond is held in the oracle module account. ed25519_pubkey is reserved
// for the future ABCI++ vote-extension flow that has validators co-sign
// pull responses; today it is informational.
//
// suspended_until > 0 freezes the provider until the listed unix second;
// at the next EndBlock the keeper sweeps expired suspensions back to
// ACTIVE. suspension_reason is human-readable for off-chain dashboards.
message Provider {
  string address = 1;
  string name = 2;
  ProviderStatus status = 3;
  cosmos.base.v1beta1.Coin bond = 4 [(gogoproto.nullable) = false];
  int64 joined_at = 5;
  int64 suspended_at = 6;
  int64 suspended_until = 7;
  string suspended_reason = 8;
  bytes ed25519_pubkey = 9;
  string contact_uri = 10;

  // bond_release_height is the height after which a withdrawing provider
  // may complete the WithdrawBond flow. Zero unless status =
  // PROVIDER_STATUS_WITHDRAWING.
  int64 bond_release_height = 11;
}

// Submission is a provider's most recent value for a Topic. The store is
// keyed by (topic_id, provider), so each provider has at most one row
// per topic at any time and re-submitting overwrites in place.
message Submission {
  string topic_id = 1;
  string provider = 2;
  // value is the scaled integer payload (multiply by 10^topic.value_decimals
  // to recover the conceptual amount). Stored as int64 so negative values
  // (e.g. negative PJM congestion) are first-class.
  int64 value = 3;
  // metadata is an opaque, capped string for off-chain context (e.g.
  // exchange URL). Validation rejects payloads larger than
  // params.max_metadata_size.
  string metadata = 4;
  int64 timestamp = 5;
  int64 height = 6;
  // attestation, when set, is the provider's signature over a canonical
  // (topic_id|value|timestamp) message. The chain only stores the bytes
  // and exposes them for off-chain audit; on-chain verification happens
  // when ABCI++ vote extensions land.
  bytes attestation = 7;
}

// AggregatedValue is the latest deterministic aggregation result for a
// Topic. EndBlock writes one row per enabled, non-paused topic that has
// at least min_submissions fresh submissions. source_min / source_max
// expose the raw spread so consumers can decide whether to trust the
// number even when min_submissions is met.
message AggregatedValue {
  string topic_id = 1;
  int64 value = 2;
  uint32 num_sources = 3;
  int64 source_min = 4;
  int64 source_max = 5;
  int64 computed_height = 6;
  int64 computed_time = 7;
  AggregationFn aggregation = 8;
}

// ReserveAttestation captures a custodian's M-of-N attestation that an
// off-chain reserve (e.g. USDC backing) holds at least the stated
// amount. attestation_uri / hash points at the off-chain document
// signed by the listed signers. Consumed by x/stablecoin's PoR check.
//
// signers must contain at least threshold elements; on-chain we only
// verify the structural threshold relation. Off-chain consumers verify
// the document's actual signatures against signer public keys.
message ReserveAttestation {
  string id = 1;
  string asset = 2;            // free-form, e.g. "USDC", "EUR-RE"
  string custodian = 3;        // bech32 of the submitter
  string amount = 4;           // big-int as decimal string
  string attestation_uri = 5;
  string attestation_hash = 6; // sha256 hex of the resolved doc
  repeated string signers = 7; // bech32 of co-signers
  uint32 threshold = 8;        // M of len(signers)
  int64 submitted_at = 9;
  int64 submitted_height = 10;
}

// Params defines the oracle module parameters.
//
// min_submissions / max_data_age act as defaults whenever a Topic does
// not override them. max_metadata_size caps Submission.metadata bytes.
//
// bond_min_amount is the minimum coin value a provider must escrow when
// registering. bond_denom is the only denom accepted; the bond is held
// in the oracle module account.
//
// bond_release_cooldown is the number of blocks a withdrawing provider
// must wait between RequestWithdraw and WithdrawBond, giving x/dataslash
// (and governance) time to challenge.
message Params {
  uint32 min_submissions = 1;
  int64 data_max_age = 2;
  uint32 max_metadata_size = 3;

  string bond_denom = 4;
  string bond_min_amount = 5; // big-int as decimal string
  int64 bond_release_cooldown = 6;

  // max_topics_per_block bounds how many topics may be aggregated per
  // EndBlock; the rest carry over to the next block. Keeps gas
  // predictable as topic count grows.
  uint32 max_topics_per_block = 7;
  // max_submissions_per_topic bounds how many submissions a single
  // aggregation may consume; defends against a topic with thousands of
  // providers eating the block.
  uint32 max_submissions_per_topic = 8;
}

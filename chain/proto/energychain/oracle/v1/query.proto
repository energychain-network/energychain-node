syntax = "proto3";
package energychain.oracle.v1;

import "gogoproto/gogo.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "energychain/oracle/v1/types.proto";

option go_package = "energychain/x/oracle/types";

service Query {
  rpc Topic(QueryTopicRequest) returns (QueryTopicResponse);
  rpc Topics(QueryTopicsRequest) returns (QueryTopicsResponse);

  rpc Provider(QueryProviderRequest) returns (QueryProviderResponse);
  rpc Providers(QueryProvidersRequest) returns (QueryProvidersResponse);

  rpc Submission(QuerySubmissionRequest) returns (QuerySubmissionResponse);
  rpc Submissions(QuerySubmissionsRequest) returns (QuerySubmissionsResponse);

  rpc Aggregated(QueryAggregatedRequest) returns (QueryAggregatedResponse);
  rpc AllAggregated(QueryAllAggregatedRequest) returns (QueryAllAggregatedResponse);

  rpc ReserveAttestation(QueryReserveAttestationRequest) returns (QueryReserveAttestationResponse);
  rpc ReserveAttestations(QueryReserveAttestationsRequest) returns (QueryReserveAttestationsResponse);

  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);
}

message QueryTopicRequest { string id = 1; }
message QueryTopicResponse { Topic topic = 1 [(gogoproto.nullable) = false]; }

message QueryTopicsRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryTopicsResponse {
  repeated Topic topics = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryProviderRequest { string address = 1; }
message QueryProviderResponse { Provider provider = 1 [(gogoproto.nullable) = false]; }

message QueryProvidersRequest {
  ProviderStatus status = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryProvidersResponse {
  repeated Provider providers = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QuerySubmissionRequest {
  string topic_id = 1;
  string provider = 2;
}
message QuerySubmissionResponse { Submission submission = 1 [(gogoproto.nullable) = false]; }

message QuerySubmissionsRequest {
  string topic_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QuerySubmissionsResponse {
  repeated Submission submissions = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryAggregatedRequest { string topic_id = 1; }
message QueryAggregatedResponse { AggregatedValue value = 1 [(gogoproto.nullable) = false]; }

message QueryAllAggregatedRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryAllAggregatedResponse {
  repeated AggregatedValue values = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryReserveAttestationRequest { string id = 1; }
message QueryReserveAttestationResponse { ReserveAttestation attestation = 1 [(gogoproto.nullable) = false]; }

message QueryReserveAttestationsRequest {
  string asset = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryReserveAttestationsResponse {
  repeated ReserveAttestation attestations = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }

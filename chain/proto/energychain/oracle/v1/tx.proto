syntax = "proto3";
package energychain.oracle.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "energychain/oracle/v1/types.proto";

option go_package = "energychain/x/oracle/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  // Topic lifecycle (gov-only).
  rpc RegisterTopic(MsgRegisterTopic) returns (MsgRegisterTopicResponse);
  rpc UpdateTopic(MsgUpdateTopic) returns (MsgUpdateTopicResponse);
  rpc PauseTopic(MsgPauseTopic) returns (MsgPauseTopicResponse);
  rpc ResumeTopic(MsgResumeTopic) returns (MsgResumeTopicResponse);

  // Provider lifecycle.
  rpc RegisterProvider(MsgRegisterProvider) returns (MsgRegisterProviderResponse);
  rpc TopUpBond(MsgTopUpBond) returns (MsgTopUpBondResponse);
  rpc RequestWithdrawBond(MsgRequestWithdrawBond) returns (MsgRequestWithdrawBondResponse);
  rpc WithdrawBond(MsgWithdrawBond) returns (MsgWithdrawBondResponse);
  rpc SuspendProvider(MsgSuspendProvider) returns (MsgSuspendProviderResponse);

  // Data submission.
  rpc SubmitValue(MsgSubmitValue) returns (MsgSubmitValueResponse);
  rpc SubmitReserveAttestation(MsgSubmitReserveAttestation) returns (MsgSubmitReserveAttestationResponse);

  // Params (gov-only).
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// ---------------------------------------------------------------------------
// Topics
// ---------------------------------------------------------------------------

message MsgRegisterTopic {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Topic topic = 2 [(gogoproto.nullable) = false];
}
message MsgRegisterTopicResponse {}

message MsgUpdateTopic {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Topic topic = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateTopicResponse {}

message MsgPauseTopic {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string topic_id = 2;
  string reason = 3;
}
message MsgPauseTopicResponse {}

message MsgResumeTopic {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string topic_id = 2;
}
message MsgResumeTopicResponse {}

// ---------------------------------------------------------------------------
// Providers
// ---------------------------------------------------------------------------

// MsgRegisterProvider escrows the initial bond into the oracle module
// account. Provider may submit values immediately after registration
// (subject to topic allow_lists).
message MsgRegisterProvider {
  option (cosmos.msg.v1.signer) = "address";
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
  cosmos.base.v1beta1.Coin bond = 3 [(gogoproto.nullable) = false];
  bytes ed25519_pubkey = 4;
  string contact_uri = 5;
}
message MsgRegisterProviderResponse {}

message MsgTopUpBond {
  option (cosmos.msg.v1.signer) = "address";
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}
message MsgTopUpBondResponse {}

// MsgRequestWithdrawBond moves the provider into PROVIDER_STATUS_WITHDRAWING
// and starts the bond_release_cooldown clock. The provider can no
// longer submit values from this point on.
message MsgRequestWithdrawBond {
  option (cosmos.msg.v1.signer) = "address";
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgRequestWithdrawBondResponse {
  int64 release_height = 1;
}

// MsgWithdrawBond actually returns the bond to the provider. Rejected
// before release_height; succeeds after, returning the entire bond and
// retiring the provider record.
message MsgWithdrawBond {
  option (cosmos.msg.v1.signer) = "address";
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgWithdrawBondResponse {
  cosmos.base.v1beta1.Coin returned = 1 [(gogoproto.nullable) = false];
}

// MsgSuspendProvider freezes a provider for a fixed duration. Authority
// is governance today; the M3 dataslash module will gain a delegated
// permission via expected_keepers.
message MsgSuspendProvider {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  int64 until = 3;
  string reason = 4;
}
message MsgSuspendProviderResponse {}

// ---------------------------------------------------------------------------
// Submissions
// ---------------------------------------------------------------------------

message MsgSubmitValue {
  option (cosmos.msg.v1.signer) = "provider";
  string provider = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string topic_id = 2;
  int64 value = 3;
  string metadata = 4;
  int64 timestamp = 5;
  bytes attestation = 6;
}
message MsgSubmitValueResponse {}

message MsgSubmitReserveAttestation {
  option (cosmos.msg.v1.signer) = "custodian";
  string custodian = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string id = 2;
  string asset = 3;
  string amount = 4;
  string attestation_uri = 5;
  string attestation_hash = 6;
  repeated string signers = 7;
  uint32 threshold = 8;
}
message MsgSubmitReserveAttestationResponse {}

// ---------------------------------------------------------------------------
// Params
// ---------------------------------------------------------------------------

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

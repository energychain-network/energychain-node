syntax = "proto3";
package energychain.oracle.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "energychain/oracle/v1/types.proto";

option go_package = "energychain/x/oracle/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc SubmitData(MsgSubmitData) returns (MsgSubmitDataResponse);
  rpc AddOracle(MsgAddOracle) returns (MsgAddOracleResponse);
  rpc RemoveOracle(MsgRemoveOracle) returns (MsgRemoveOracleResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgSubmitData {
  option (cosmos.msg.v1.signer) = "submitter";

  string submitter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string category = 2;
  string value = 3;
  string metadata = 4;
  int64 timestamp = 5;
}
message MsgSubmitDataResponse {}

message MsgAddOracle {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string oracle_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 3;
  repeated string authorized_categories = 4;
}
message MsgAddOracleResponse {}

message MsgRemoveOracle {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string oracle_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgRemoveOracleResponse {}

// MsgUpdateParams replaces the entire oracle module Params. Signer must be
// the module authority (gov module address).
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

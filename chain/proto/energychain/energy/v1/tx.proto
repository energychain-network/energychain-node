syntax = "proto3";
package energychain.energy.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "energychain/energy/v1/types.proto";

option go_package = "energychain/x/energy/types";

// Msg defines the energy module Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc SubmitEnergyData(MsgSubmitEnergyData) returns (MsgSubmitEnergyDataResponse);
  rpc BatchSubmit(MsgBatchSubmit) returns (MsgBatchSubmitResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgSubmitEnergyData {
  option (cosmos.msg.v1.signer) = "submitter";

  string submitter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string category = 2;
  string data_hash = 3;
  string metadata = 4;
}

message MsgSubmitEnergyDataResponse {
  string id = 1 [(gogoproto.customname) = "ID"];
}

message MsgBatchSubmit {
  option (cosmos.msg.v1.signer) = "submitter";

  string submitter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string category = 2;
  repeated BatchItem items = 3 [(gogoproto.nullable) = false];
  string merkle_root = 4;
}

message MsgBatchSubmitResponse {
  string batch_id = 1 [(gogoproto.customname) = "BatchID"];
  uint32 data_count = 2;
}

// MsgUpdateParams replaces the entire energy module Params. Signer must be
// the module authority (gov module address).
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false];
}

message MsgUpdateParamsResponse {}

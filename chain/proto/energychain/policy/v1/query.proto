syntax = "proto3";
package energychain.policy.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";

import "energychain/policy/v1/types.proto";

option go_package = "energychain/x/policy/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);

  rpc Policy(QueryPolicyRequest) returns (QueryPolicyResponse);
  rpc Policies(QueryPoliciesRequest) returns (QueryPoliciesResponse);

  rpc Binding(QueryBindingRequest) returns (QueryBindingResponse);
  rpc Bindings(QueryBindingsRequest) returns (QueryBindingsResponse);

  rpc EvaluationLogs(QueryEvaluationLogsRequest) returns (QueryEvaluationLogsResponse);

  // Evaluate is a DRY-RUN endpoint: clients can ask "would this transfer
  // pass?" without actually moving any state. The chain returns the same
  // Result struct an asset module would consume, so SDKs can pre-flight
  // a transfer before signing.
  rpc Evaluate(QueryEvaluateRequest) returns (QueryEvaluateResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

message QueryPolicyRequest { string id = 1; }
message QueryPolicyResponse { Policy policy = 1; }

message QueryPoliciesRequest {
  PolicyStatus status = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryPoliciesResponse {
  repeated Policy policies = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryBindingRequest {
  string asset_class = 1;
  string asset_id = 2;
}
message QueryBindingResponse { PolicyBinding binding = 1; }

message QueryBindingsRequest {
  string asset_class = 1;
  string policy_id = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryBindingsResponse {
  repeated PolicyBinding bindings = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryEvaluationLogsRequest {
  string policy_id = 1;
  string asset_class = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryEvaluationLogsResponse {
  repeated EvaluationLog logs = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryEvaluateRequest mirrors the dsl.Context the keeper would build
// for a real transfer. Identity / sanctions / freeze / lockup signals
// can either be passed in by the client (off-chain pre-flight) or, when
// blank, resolved by the chain via expected_keepers.
message QueryEvaluateRequest {
  string asset_class = 1;
  string asset_id = 2;
  string sender = 3;
  string receiver = 4;
  uint64 amount = 5;
  // Optional overrides — tests / off-chain simulators populate these
  // when they want a counter-factual ("what if Alice WERE accredited?").
  // Leave empty to use on-chain state.
  string sender_jurisdiction = 6;
  string receiver_jurisdiction = 7;
  repeated string sender_credentials = 8;
  repeated string receiver_credentials = 9;
  uint64 sender_holdings = 10;
  uint64 receiver_holdings = 11;
}
message QueryEvaluateResponse {
  bool allowed = 1;
  uint32 code = 2;
  string detail = 3;
  uint32 failed_rule_index = 4;
  string policy_id = 5;
}

syntax = "proto3";
package energychain.did.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "energychain/did/v1/types.proto";

option go_package = "energychain/x/did/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc CreateDID         (MsgCreateDID)         returns (MsgCreateDIDResponse);
  rpc UpdateDID         (MsgUpdateDID)         returns (MsgUpdateDIDResponse);
  rpc DeactivateDID     (MsgDeactivateDID)     returns (MsgDeactivateDIDResponse);
  rpc RotateKey         (MsgRotateKey)         returns (MsgRotateKeyResponse);

  rpc IssueCredential   (MsgIssueCredential)   returns (MsgIssueCredentialResponse);
  rpc RevokeCredential  (MsgRevokeCredential)  returns (MsgRevokeCredentialResponse);

  rpc RegisterAnchor    (MsgRegisterAnchor)    returns (MsgRegisterAnchorResponse);
  rpc DeactivateAnchor  (MsgDeactivateAnchor)  returns (MsgDeactivateAnchorResponse);

  rpc UpdateParams      (MsgUpdateParams)      returns (MsgUpdateParamsResponse);
}

// ---------------------------------------------------------------------------
// DID lifecycle
// ---------------------------------------------------------------------------

message MsgCreateDID {
  option (cosmos.msg.v1.signer) = "creator";

  // Creator is the bech32 address that pays the gas; MUST be the same as
  // `subject` on first creation (no third-party DID provisioning).
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string subject = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated string controllers = 3;
  repeated VerificationMethod verification = 4 [(gogoproto.nullable) = false];
  repeated ServiceEndpoint    service      = 5 [(gogoproto.nullable) = false];
}
message MsgCreateDIDResponse { uint64 version = 1; }

message MsgUpdateDID {
  option (cosmos.msg.v1.signer) = "controller";

  // Controller MUST appear in the document's controllers set.
  string controller = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string subject    = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // Replace semantics: every list field is overwritten wholesale to
  // avoid the "what does empty list mean" ambiguity that haunts merge
  // semantics.
  repeated string controllers = 3;
  repeated VerificationMethod verification = 4 [(gogoproto.nullable) = false];
  repeated ServiceEndpoint    service      = 5 [(gogoproto.nullable) = false];
  // ExpectedVersion guards against lost-update races. Pass the current
  // version returned by Query.DID; the chain rejects the message if the
  // stored version differs.
  uint64 expected_version = 6;
}
message MsgUpdateDIDResponse { uint64 version = 1; }

message MsgDeactivateDID {
  option (cosmos.msg.v1.signer) = "controller";

  string controller = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string subject    = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgDeactivateDIDResponse {}

message MsgRotateKey {
  option (cosmos.msg.v1.signer) = "controller";

  string controller = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string subject    = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // OldKeyID identifies the verificationMethod entry to retire.
  string old_key_id = 3;
  // NewKey is appended to the verification list.
  VerificationMethod new_key = 4 [(gogoproto.nullable) = false];
}
message MsgRotateKeyResponse { uint64 version = 1; }

// ---------------------------------------------------------------------------
// Verifiable credentials
// ---------------------------------------------------------------------------

message MsgIssueCredential {
  option (cosmos.msg.v1.signer) = "issuer";

  string issuer  = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string subject = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // ID is supplied by the issuer; SHOULD be a urn:uuid: string.
  string id      = 3;
  string type    = 4;
  string hash    = 5;
  int64  issued_at  = 6;
  int64  expires_at = 7;
}
message MsgIssueCredentialResponse {}

message MsgRevokeCredential {
  option (cosmos.msg.v1.signer) = "issuer";

  string issuer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string id     = 2;
  string reason = 3;
}
message MsgRevokeCredentialResponse {}

// ---------------------------------------------------------------------------
// Trust anchors (governance)
// ---------------------------------------------------------------------------

message MsgRegisterAnchor {
  option (cosmos.msg.v1.signer) = "authority";

  // Authority is either the gov module address (for root tier) or a
  // root anchor's DID (for intermediate tier).
  string authority         = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string did               = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string tier              = 3;
  string parent_did        = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated string credential_types = 5;
}
message MsgRegisterAnchorResponse {}

message MsgDeactivateAnchor {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string did       = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgDeactivateAnchorResponse {}

// ---------------------------------------------------------------------------
// Module params (gov)
// ---------------------------------------------------------------------------

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params    = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

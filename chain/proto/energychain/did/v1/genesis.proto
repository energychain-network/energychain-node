syntax = "proto3";
package energychain.did.v1;

import "gogoproto/gogo.proto";
import "energychain/did/v1/types.proto";

option go_package = "energychain/x/did/types";

message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated DIDDocument      documents   = 2 [(gogoproto.nullable) = false];
  repeated CredentialStatus credentials = 3 [(gogoproto.nullable) = false];
  repeated TrustAnchor      anchors     = 4 [(gogoproto.nullable) = false];
}

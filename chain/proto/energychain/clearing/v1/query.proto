syntax = "proto3";
package energychain.clearing.v1;

import "gogoproto/gogo.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "energychain/clearing/v1/types.proto";

option go_package = "energychain/x/clearing/types";

service Query {
  rpc Params       (QueryParamsRequest)       returns (QueryParamsResponse);
  rpc Member       (QueryMemberRequest)       returns (QueryMemberResponse);
  rpc Members      (QueryMembersRequest)      returns (QueryMembersResponse);
  rpc Cycle        (QueryCycleRequest)        returns (QueryCycleResponse);
  rpc Cycles       (QueryCyclesRequest)       returns (QueryCyclesResponse);
  rpc Obligation   (QueryObligationRequest)   returns (QueryObligationResponse);
  rpc Obligations  (QueryObligationsRequest)  returns (QueryObligationsResponse);
  rpc NetPositions (QueryNetPositionsRequest) returns (QueryNetPositionsResponse);
  rpc DefaultEvents(QueryDefaultEventsRequest)returns (QueryDefaultEventsResponse);
  rpc MarginBalance(QueryMarginBalanceRequest)returns (QueryMarginBalanceResponse);
  rpc DefaultFund  (QueryDefaultFundRequest)  returns (QueryDefaultFundResponse);
  rpc PoolAddress  (QueryPoolAddressRequest)  returns (QueryPoolAddressResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }

message QueryMemberRequest  { uint64 id = 1; }
message QueryMemberResponse { Member member = 1 [(gogoproto.nullable) = false]; }

message QueryMembersRequest  { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryMembersResponse {
  repeated Member members = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryCycleRequest  { uint64 id = 1; }
message QueryCycleResponse { Cycle cycle = 1 [(gogoproto.nullable) = false]; }

message QueryCyclesRequest  { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryCyclesResponse {
  repeated Cycle cycles = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryObligationRequest  { uint64 id = 1; }
message QueryObligationResponse { Obligation obligation = 1 [(gogoproto.nullable) = false]; }

message QueryObligationsRequest {
  uint64 cycle_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryObligationsResponse {
  repeated Obligation obligations = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryNetPositionsRequest  { uint64 cycle_id = 1; }
message QueryNetPositionsResponse {
  repeated NetPosition positions = 1 [(gogoproto.nullable) = false];
}

message QueryDefaultEventsRequest  { uint64 cycle_id = 1; }
message QueryDefaultEventsResponse {
  repeated DefaultEvent events = 1 [(gogoproto.nullable) = false];
}

message QueryMarginBalanceRequest {
  uint64 member_id = 1;
  string denom = 2;
}
message QueryMarginBalanceResponse {
  uint64 balance = 1;
  uint64 required = 2;
  // Gross outstanding outbound obligations reserved against
  // the balance. A withdrawal of `balance - max(required,
  // reservation)` is the maximum allowed for a non-EXPELLED
  // member.
  uint64 reservation = 3;
}

message QueryDefaultFundRequest  { string denom = 1; }
message QueryDefaultFundResponse {
  uint64 total = 1;
}

message QueryPoolAddressRequest {}
message QueryPoolAddressResponse { string pool = 1; }

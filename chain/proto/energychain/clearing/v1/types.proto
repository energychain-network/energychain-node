syntax = "proto3";
package energychain.clearing.v1;

import "gogoproto/gogo.proto";

option go_package = "energychain/x/clearing/types";

// MemberStatus governs whether a member can submit obligations.
//
// ACTIVE     — fully participating.
// SUSPENDED  — pause submitting new obligations; existing
//              obligations and margin remain. Defaults still
//              attribute to this member.
// EXPELLED   — terminal. Margin drained back to the member,
//              default-fund share remains forfeit, member id
//              cannot be reused.
enum MemberStatus {
  MEMBER_STATUS_UNSPECIFIED = 0;
  MEMBER_STATUS_ACTIVE      = 1;
  MEMBER_STATUS_SUSPENDED   = 2;
  MEMBER_STATUS_EXPELLED    = 3;
}

// CycleStatus tracks the lifecycle of a settlement cycle.
//
// OPEN       — accepting MsgSubmitObligation calls.
// CLOSED     — no new obligations accepted; awaiting Settle or
//              Cancel.
// SETTLED    — netted and atomically applied; obligations
//              cleared from book.
// DEFAULTED  — at least one member failed to cover their net
//              obligation; the waterfall absorbed the
//              shortfall (margin → default fund). Cycle is
//              terminal.
// CANCELLED  — aborted by governance, all obligations dropped,
//              no movement occurred.
enum CycleStatus {
  CYCLE_STATUS_UNSPECIFIED = 0;
  CYCLE_STATUS_OPEN        = 1;
  CYCLE_STATUS_CLOSED      = 2;
  CYCLE_STATUS_SETTLED     = 3;
  CYCLE_STATUS_DEFAULTED   = 4;
  CYCLE_STATUS_CANCELLED   = 5;
}

// Member is a counterparty registered with the clearing house.
// Margin is held in the module pool and indexed (denom, member).
message Member {
  uint64 id = 1;
  string address = 2;
  MemberStatus status = 3;
  // Required margin per denom: the chain refuses to net a
  // member's obligation in a cycle if their margin balance
  // for that denom is below this floor at cycle close. Empty
  // means "no margin required" — typical for non-cash legs
  // such as bare EAC retire requests where the asset is
  // delivered up-front via x/eac.EscrowLock.
  map<string, uint64> required_margin = 4;
  // Default-fund share contributed by this member, per denom.
  // Members share the second-tier loss bucket pro-rata to
  // their contribution.
  map<string, uint64> default_fund_share = 5;
  int64 joined_at = 6;
  string memo = 7;
}

// Cycle is one netting + settlement round.
message Cycle {
  uint64 id = 1;
  CycleStatus status = 2;
  int64 open_time = 3;
  int64 close_time = 4;
  int64 settled_time = 5;
  // memo (optional) for off-chain reference: e.g. "T+1
  // Frankfurt 2026-05-18 batch".
  string memo = 6;
  // Counts maintained incrementally to keep Settle bounded.
  uint32 obligations_count = 7;
}

// Obligation is a one-way commitment from one member to
// another on a specific denom. Multiple obligations between
// the same (from, to, denom) tuple sum together at netting
// time. The kind field captures the upstream source for
// audit purposes only — netting is denom-agnostic.
message Obligation {
  uint64 id = 1;
  uint64 cycle_id = 2;
  uint64 from_member_id = 3;
  uint64 to_member_id = 4;
  string denom = 5;
  uint64 amount = 6;
  // Free-form upstream reference for audit (e.g.
  // "market:order:12345"; "auction:lot:7"; "contract:42:settle:9").
  string source_ref = 7;
  int64 submitted_at = 8;
}

// NetPosition is the post-netting view for a (cycle, member,
// denom) triple. Magnitude + is_short representation avoids
// signed integers in protobuf.
message NetPosition {
  uint64 cycle_id = 1;
  uint64 member_id = 2;
  string denom = 3;
  // magnitude is the absolute value of (incoming - outgoing).
  uint64 magnitude = 4;
  // is_short=true means the member is a NET PAYER (outgoing
  // exceeds incoming); false means net receiver.
  bool is_short = 5;
}

// DefaultEvent records what the waterfall absorbed when a
// member failed to cover their settlement obligation.
message DefaultEvent {
  uint64 cycle_id = 1;
  uint64 member_id = 2;
  string denom = 3;
  uint64 shortfall = 4;
  // Amount sourced from the defaulter's own margin (first
  // bucket of the waterfall).
  uint64 from_margin = 5;
  // Amount sourced from the mutualized default fund (second
  // bucket).
  uint64 from_default_fund = 6;
  // Amount that the waterfall could NOT absorb. When >0 the
  // cycle is marked DEFAULTED and the unmet amount is
  // reported here for off-chain dispute resolution.
  uint64 uncovered = 7;
  int64 at = 8;
}

// Params controls module-wide policy.
message Params {
  // Maximum simultaneously OPEN cycles. >1 allows
  // overlapping settlement windows (e.g. T+1 EUR and T+1 USD
  // running in parallel).
  uint32 max_open_cycles = 1;
  // Maximum obligations per cycle. Settle is O(n) over
  // obligations + O(m*d) over members × denoms; this cap
  // keeps the worst-case bounded.
  uint32 max_obligations_per_cycle = 2;
  // Maximum members the chain will track.
  uint32 max_members = 3;
  // Memo / source_ref length caps.
  uint32 memo_max_len = 4;
  uint32 source_ref_max_len = 5;
}

syntax = "proto3";
package energychain.carbon.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";

import "energychain/carbon/v1/types.proto";

option go_package = "energychain/x/carbon/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);

  rpc Issuer(QueryIssuerRequest) returns (QueryIssuerResponse);
  rpc Issuers(QueryIssuersRequest) returns (QueryIssuersResponse);

  rpc Asset(QueryAssetRequest) returns (QueryAssetResponse);
  rpc Assets(QueryAssetsRequest) returns (QueryAssetsResponse);
  rpc AssetsByIssuer(QueryAssetsByIssuerRequest) returns (QueryAssetsByIssuerResponse);

  rpc Balance(QueryBalanceRequest) returns (QueryBalanceResponse);
  rpc BalancesByOwner(QueryBalancesByOwnerRequest) returns (QueryBalancesByOwnerResponse);

  rpc Retirement(QueryRetirementRequest) returns (QueryRetirementResponse);
  rpc RetirementsByBeneficiary(QueryRetirementsByBeneficiaryRequest) returns (QueryRetirementsByBeneficiaryResponse);
  rpc RetirementsByAsset(QueryRetirementsByAssetRequest) returns (QueryRetirementsByAssetResponse);

  rpc Article6Authorization(QueryArticle6AuthorizationRequest) returns (QueryArticle6AuthorizationResponse);

  rpc BridgeAttestation(QueryBridgeAttestationRequest) returns (QueryBridgeAttestationResponse);

  // EACOffsetClaimed reports the running tally of OFFSET units that
  // have referenced the given x/eac certificate. Useful for
  // off-chain mutual-exclusion checks.
  rpc EACOffsetClaimed(QueryEACOffsetClaimedRequest) returns (QueryEACOffsetClaimedResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }

message QueryIssuerRequest { string id = 1; }
message QueryIssuerResponse { Issuer issuer = 1 [(gogoproto.nullable) = false]; }

message QueryIssuersRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryIssuersResponse {
  repeated Issuer issuers = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryAssetRequest { uint64 id = 1; }
message QueryAssetResponse { Asset asset = 1 [(gogoproto.nullable) = false]; }

message QueryAssetsRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryAssetsResponse {
  repeated Asset assets = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryAssetsByIssuerRequest {
  string issuer_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryAssetsByIssuerResponse {
  repeated Asset assets = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryBalanceRequest {
  uint64 asset_id = 1;
  string account = 2;
}
message QueryBalanceResponse { uint64 balance = 1; }

message QueryBalancesByOwnerRequest {
  string owner = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message OwnedBalance {
  uint64 asset_id = 1;
  uint64 balance = 2;
}
message QueryBalancesByOwnerResponse {
  repeated OwnedBalance balances = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryRetirementRequest { uint64 id = 1; }
message QueryRetirementResponse { Retirement retirement = 1 [(gogoproto.nullable) = false]; }

message QueryRetirementsByBeneficiaryRequest {
  string beneficiary = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryRetirementsByBeneficiaryResponse {
  repeated Retirement retirements = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryRetirementsByAssetRequest {
  uint64 asset_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryRetirementsByAssetResponse {
  repeated Retirement retirements = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryArticle6AuthorizationRequest { uint64 asset_id = 1; }
message QueryArticle6AuthorizationResponse {
  Article6Authorization authorization = 1 [(gogoproto.nullable) = false];
}

message QueryBridgeAttestationRequest { uint64 asset_id = 1; }
message QueryBridgeAttestationResponse {
  BridgeAttestation attestation = 1 [(gogoproto.nullable) = false];
}

message QueryEACOffsetClaimedRequest { uint64 eac_certificate_id = 1; }
message QueryEACOffsetClaimedResponse { uint64 claimed_units = 1; }

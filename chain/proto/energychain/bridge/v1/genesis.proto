syntax = "proto3";
package energychain.bridge.v1;

import "gogoproto/gogo.proto";
import "energychain/bridge/v1/types.proto";

option go_package = "energychain/x/bridge/types";

message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated ExternalChain chains = 2 [(gogoproto.nullable) = false];
  repeated Asset assets = 3 [(gogoproto.nullable) = false];
  repeated Outbound outbounds = 4 [(gogoproto.nullable) = false];
  repeated Inbound inbounds = 5 [(gogoproto.nullable) = false];
  uint64 chain_id_seq = 6;
  uint64 asset_id_seq = 7;
  uint64 outbound_nonce_seq = 8;
  uint64 inbound_id_seq = 9;
}

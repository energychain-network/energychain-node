syntax = "proto3";
package energychain.device.v1;

import "gogoproto/gogo.proto";
import "energychain/device/v1/types.proto";

option go_package = "energychain/x/device/types";

message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated Device              devices     = 2 [(gogoproto.nullable) = false];
  repeated AttestationEvidence attestations = 3 [(gogoproto.nullable) = false];
  uint64 next_attestation_id = 4;
}

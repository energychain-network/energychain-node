syntax = "proto3";
package energychain.device.v1;

import "gogoproto/gogo.proto";

option go_package = "energychain/x/device/types";

// DeviceClass enumerates the equipment categories the chain understands.
// Strings ride alongside in metadata for niche subtypes; the enum is the
// primary filter for x/eac and x/meter eligibility checks.
enum DeviceClass {
  DEVICE_CLASS_UNSPECIFIED = 0;
  DEVICE_CLASS_METER       = 1;
  DEVICE_CLASS_INVERTER    = 2;
  DEVICE_CLASS_CHARGER     = 3;
  DEVICE_CLASS_BATTERY     = 4;
  DEVICE_CLASS_SENSOR      = 5;
  DEVICE_CLASS_GATEWAY     = 6;
}

// AttestationStatus tracks the remote-attestation lifecycle. The chain
// transitions devices Unverified -> Attested via MsgAttestDevice, and
// Attested -> Suspect when the controller flags a firmware mismatch via
// MsgFlagFirmwareMismatch. Attested is the only state where dependent
// modules accept the device's signed payloads.
enum AttestationStatus {
  ATTESTATION_STATUS_UNSPECIFIED = 0;
  ATTESTATION_STATUS_UNVERIFIED  = 1;
  ATTESTATION_STATUS_ATTESTED    = 2;
  ATTESTATION_STATUS_SUSPECT     = 3;
  ATTESTATION_STATUS_REVOKED     = 4;
}

// Device is the on-chain record of a metering / generation / storage
// device. Owner and DeviceDID are kept distinct: the owner is a *legal*
// subject (controls the device's operations on-chain), the DeviceDID is
// the *cryptographic* identity used to sign payloads. Splitting them lets
// a single subject own thousands of devices without thousands of bech32
// derivations on the subject's keychain.
message Device {
  string device_did = 1;
  string owner_did  = 2;

  DeviceClass class = 3;
  string model         = 4;
  string serial_number = 5;
  string firmware_hash = 6;
  string grid_zone     = 7;

  // Latitude / longitude × 1e7 to keep the value as an integer; mirrors
  // OSM and Tendermint coordinate conventions.
  int64 lat_e7 = 8;
  int64 lon_e7 = 9;

  AttestationStatus status = 10;
  // AttestedAt is the unix-second when the most recent attestation
  // succeeded. Re-zeroed on Suspect / Revoke transitions.
  int64 attested_at = 11;
  // AttestationExpiresAt is the deadline by which the device MUST
  // re-attest, otherwise the end-blocker auto-flips status to Suspect.
  int64 attestation_expires_at = 12;

  // PublicKey is the device's signing key (tied to DeviceDID's
  // verificationMethod). Stored here as a denormalised cache for
  // hot-path lookups by x/meter — saves a cross-module read on every
  // submitted reading.
  bytes  public_key      = 13;
  uint32 public_key_type = 14;

  int64 registered_at = 15;
  int64 updated_at    = 16;
}

// AttestationEvidence is the raw evidence the controller submits when
// asserting that a device's firmware is genuine. We do NOT verify the
// evidence on-chain: that requires per-vendor (Intel SGX, AMD SEV, NVIDIA
// CC, ARM TrustZone) verifier code that is too vendor-specific to live in
// consensus. Instead, the chain stores the evidence + the attesting
// controller's DID, and a designated `attestation_verifier` (registered
// in Params) issues a follow-up MsgConfirmAttestation that flips status
// to ATTESTED. This is the same architecture the docs §4.4 oracle module
// uses for storage-of-truth + multi-party verification.
message AttestationEvidence {
  string device_did   = 1;
  string verifier_did = 2;
  // Format identifies how to parse `evidence`, e.g. "tdx-quote-v4",
  // "sgx-quote-v3", "tpm2-pcr-bundle".
  string format = 3;
  bytes  evidence = 4;
  // Nonce is the chain-issued challenge that prevents replay.
  bytes  nonce = 5;
  int64  submitted_at = 6;
  // Verdict: 0 = pending, 1 = accepted, 2 = rejected.
  uint32 verdict = 7;
  string reason  = 8;
}

// Params governs device-registry policy.
message Params {
  // AttestationValidity is the maximum number of seconds an attestation
  // remains valid; after this elapses the end-blocker auto-flips
  // ATTESTED -> SUSPECT.
  int64 attestation_validity = 1;

  // AttestationVerifiers is the whitelist of DIDs allowed to confirm a
  // device's attestation. Empty list disables on-chain confirmation
  // (chain authority must use governance-driven MsgUpdateParams to add
  // a verifier first).
  repeated string attestation_verifiers = 2;

  // MaxDevicesPerOwner caps how many devices a single owner_did may
  // register. Pure DoS guard; raise via governance for IoT operators.
  uint32 max_devices_per_owner = 3;
}

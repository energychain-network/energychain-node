syntax = "proto3";
package energychain.eac.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";

import "energychain/eac/v1/types.proto";

option go_package = "energychain/x/eac/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);

  rpc Issuer(QueryIssuerRequest) returns (QueryIssuerResponse);
  rpc Issuers(QueryIssuersRequest) returns (QueryIssuersResponse);

  rpc Certificate(QueryCertificateRequest) returns (QueryCertificateResponse);
  rpc Certificates(QueryCertificatesRequest) returns (QueryCertificatesResponse);
  rpc CertificatesByIssuer(QueryCertificatesByIssuerRequest) returns (QueryCertificatesByIssuerResponse);

  rpc Balance(QueryBalanceRequest) returns (QueryBalanceResponse);
  rpc BalancesByOwner(QueryBalancesByOwnerRequest) returns (QueryBalancesByOwnerResponse);

  rpc Retirement(QueryRetirementRequest) returns (QueryRetirementResponse);
  rpc RetirementsByBeneficiary(QueryRetirementsByBeneficiaryRequest) returns (QueryRetirementsByBeneficiaryResponse);
  rpc RetirementsByCertificate(QueryRetirementsByCertificateRequest) returns (QueryRetirementsByCertificateResponse);

  rpc BridgeAttestation(QueryBridgeAttestationRequest) returns (QueryBridgeAttestationResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

message QueryIssuerRequest { string id = 1; }
message QueryIssuerResponse { Issuer issuer = 1 [(gogoproto.nullable) = false]; }

message QueryIssuersRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
message QueryIssuersResponse {
  repeated Issuer issuers = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryCertificateRequest { uint64 id = 1; }
message QueryCertificateResponse { Certificate certificate = 1 [(gogoproto.nullable) = false]; }

message QueryCertificatesRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
message QueryCertificatesResponse {
  repeated Certificate certificates = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryCertificatesByIssuerRequest {
  string issuer_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryCertificatesByIssuerResponse {
  repeated Certificate certificates = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryBalanceRequest {
  uint64 certificate_id = 1;
  string account = 2;
}
message QueryBalanceResponse { uint64 balance = 1; }

message QueryBalancesByOwnerRequest {
  string owner = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message OwnedBalance {
  uint64 certificate_id = 1;
  uint64 balance = 2;
}
message QueryBalancesByOwnerResponse {
  repeated OwnedBalance balances = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryRetirementRequest { uint64 id = 1; }
message QueryRetirementResponse { Retirement retirement = 1 [(gogoproto.nullable) = false]; }

message QueryRetirementsByBeneficiaryRequest {
  string beneficiary = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryRetirementsByBeneficiaryResponse {
  repeated Retirement retirements = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryRetirementsByCertificateRequest {
  uint64 certificate_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryRetirementsByCertificateResponse {
  repeated Retirement retirements = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryBridgeAttestationRequest { uint64 certificate_id = 1; }
message QueryBridgeAttestationResponse { BridgeAttestation attestation = 1 [(gogoproto.nullable) = false]; }

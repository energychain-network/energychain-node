syntax = "proto3";
package energychain.eac.v1;

import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";

import "energychain/eac/v1/types.proto";

option go_package = "energychain/x/eac/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  // ---- Issuer lifecycle (governance) ----
  rpc RegisterIssuer(MsgRegisterIssuer) returns (MsgRegisterIssuerResponse);
  rpc UpdateIssuer(MsgUpdateIssuer) returns (MsgUpdateIssuerResponse);
  rpc SuspendIssuer(MsgSuspendIssuer) returns (MsgSuspendIssuerResponse);
  rpc RevokeIssuer(MsgRevokeIssuer) returns (MsgRevokeIssuerResponse);

  // ---- Certificate lifecycle ----
  rpc IssueBatch(MsgIssueBatch) returns (MsgIssueBatchResponse);
  rpc SealCertificate(MsgSealCertificate) returns (MsgSealCertificateResponse);
  rpc UnsealCertificate(MsgUnsealCertificate) returns (MsgUnsealCertificateResponse);

  // ---- Hot path ----
  rpc Transfer(MsgTransfer) returns (MsgTransferResponse);
  rpc Retire(MsgRetire) returns (MsgRetireResponse);

  // ---- Bridge ----
  rpc SetBridgeAttestation(MsgSetBridgeAttestation) returns (MsgSetBridgeAttestationResponse);
  rpc BridgeMint(MsgBridgeMint) returns (MsgBridgeMintResponse);
  rpc BridgeBurn(MsgBridgeBurn) returns (MsgBridgeBurnResponse);

  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// ---- Issuer ----------------------------------------------------------------

message MsgRegisterIssuer {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string did = 3;
  string display_name = 4;
  // kinds is a whitelist of CertificateKind ints; empty means "any".
  repeated int32 kinds = 5;
  string issuer_authority = 6; // bech32 that may sign IssueBatch
  string admin = 7;            // bech32 that may seal / force-retire
}
message MsgRegisterIssuerResponse {}

message MsgUpdateIssuer {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string display_name = 3;
  repeated int32 kinds = 4;
  string issuer_authority = 5;
  string admin = 6;
}
message MsgUpdateIssuerResponse {}

message MsgSuspendIssuer {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string reason = 3;
}
message MsgSuspendIssuerResponse {}

message MsgRevokeIssuer {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string reason = 3;
}
message MsgRevokeIssuerResponse {}

// ---- Certificate ----------------------------------------------------------

message MsgIssueBatch {
  option (cosmos.msg.v1.signer) = "issuer_authority";
  string issuer_authority = 1; // must match Issuer.authority
  string issuer_id = 2;
  CertificateKind kind = 3;
  Technology technology = 4;
  string project_id = 5;
  string device_id = 6;
  string grid_zone = 7;
  int64 hour_start = 8;
  int64 hour_end = 9;
  uint32 vintage_year = 10;
  string source_registry = 11;
  string source_serial = 12;
  uint64 units = 13;            // MWh count
  string recipient = 14;        // initial holder
  string policy_id = 15;        // informational binding hint
}
message MsgIssueBatchResponse {
  uint64 certificate_id = 1;
}

message MsgSealCertificate {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 certificate_id = 2;
  string reason = 3;
}
message MsgSealCertificateResponse {}

message MsgUnsealCertificate {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 certificate_id = 2;
  string reason = 3;
}
message MsgUnsealCertificateResponse {}

message MsgTransfer {
  option (cosmos.msg.v1.signer) = "from";
  string from = 1;
  string to = 2;
  uint64 certificate_id = 3;
  uint64 units = 4;
  string memo = 5;
}
message MsgTransferResponse {}

message MsgRetire {
  option (cosmos.msg.v1.signer) = "retirer";
  string retirer = 1;
  // beneficiary may be empty — defaults to retirer. When non-empty
  // the retirement is recorded as on-behalf-of (proxy retire).
  string beneficiary = 2;
  uint64 certificate_id = 3;
  uint64 units = 4;
  // purpose categorises the retirement for downstream attribution
  // ("scope2", "rggi", "article6", "tax", ...).
  string purpose = 5;
  string memo = 6;
}
message MsgRetireResponse {
  uint64 retirement_id = 1;
}

// ---- Bridge ---------------------------------------------------------------

message MsgSetBridgeAttestation {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  uint64 certificate_id = 2;
  string oracle_topic_id = 3;
  uint32 max_staleness_seconds = 4;
}
message MsgSetBridgeAttestationResponse {}

message MsgBridgeMint {
  option (cosmos.msg.v1.signer) = "issuer_authority";
  string issuer_authority = 1;
  uint64 certificate_id = 2;
  uint64 units = 3;
  string recipient = 4;
}
message MsgBridgeMintResponse {
  uint64 new_issued_units = 1;
}

message MsgBridgeBurn {
  option (cosmos.msg.v1.signer) = "holder";
  string holder = 1;
  uint64 certificate_id = 2;
  uint64 units = 3;
  // external_recipient is recorded for the off-chain bridge oracle to
  // pick up when releasing the upstream certificate.
  string external_recipient = 4;
  string memo = 5;
}
message MsgBridgeBurnResponse {}

// ---- Params ---------------------------------------------------------------

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

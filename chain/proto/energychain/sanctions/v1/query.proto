syntax = "proto3";
package energychain.sanctions.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";

import "energychain/sanctions/v1/types.proto";

option go_package = "energychain/x/sanctions/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);

  rpc List(QueryListRequest) returns (QueryListResponse);
  rpc Lists(QueryListsRequest) returns (QueryListsResponse);

  rpc Entry(QueryEntryRequest) returns (QueryEntryResponse);
  rpc Entries(QueryEntriesRequest) returns (QueryEntriesResponse);

  // IsSanctioned is the public hot-path equivalent. Returns true iff
  // the subject has any ACTIVE entry on any non-archived list.
  rpc IsSanctioned(QueryIsSanctionedRequest) returns (QueryIsSanctionedResponse);
  // SubjectListings returns the per-list rows that match a subject;
  // useful for forensics ("which authorities sanctioned this address?").
  rpc SubjectListings(QuerySubjectListingsRequest) returns (QuerySubjectListingsResponse);

  rpc Proposal(QueryProposalRequest) returns (QueryProposalResponse);
  rpc Proposals(QueryProposalsRequest) returns (QueryProposalsResponse);

  rpc Hits(QueryHitsRequest) returns (QueryHitsResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }

message QueryListRequest { string id = 1; }
message QueryListResponse { SanctionList list = 1; }

message QueryListsRequest {
  ListStatus status = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryListsResponse {
  repeated SanctionList lists = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryEntryRequest {
  string list_id = 1;
  string subject = 2;
}
message QueryEntryResponse { SanctionEntry entry = 1; }

message QueryEntriesRequest {
  string list_id = 1;
  EntryStatus status = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryEntriesResponse {
  repeated SanctionEntry entries = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryIsSanctionedRequest { string subject = 1; }
message QueryIsSanctionedResponse {
  bool sanctioned = 1;
  // matched_lists names every list that holds an ACTIVE entry for
  // the subject. Empty when sanctioned=false.
  repeated string matched_lists = 2;
}

message QuerySubjectListingsRequest {
  string subject = 1;
  EntryStatus status = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QuerySubjectListingsResponse {
  repeated SanctionEntry entries = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryProposalRequest { uint64 proposal_id = 1; }
message QueryProposalResponse { Proposal proposal = 1; }

message QueryProposalsRequest {
  string list_id = 1;
  ProposalStatus status = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryProposalsResponse {
  repeated Proposal proposals = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryHitsRequest {
  string subject = 1;
  string list_id = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryHitsResponse {
  repeated SanctionHit hits = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

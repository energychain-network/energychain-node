syntax = "proto3";
package energychain.rwatoken.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";

import "energychain/rwatoken/v1/types.proto";

option go_package = "energychain/x/rwatoken/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);

  rpc Token(QueryTokenRequest) returns (QueryTokenResponse);
  rpc Tokens(QueryTokensRequest) returns (QueryTokensResponse);

  rpc Balance(QueryBalanceRequest) returns (QueryBalanceResponse);
  rpc Flags(QueryFlagsRequest) returns (QueryFlagsResponse);
  rpc PoolBalance(QueryPoolBalanceRequest) returns (QueryPoolBalanceResponse);

  rpc Snapshot(QuerySnapshotRequest) returns (QuerySnapshotResponse);
  rpc Distribution(QueryDistributionRequest) returns (QueryDistributionResponse);
  rpc ClaimableAmount(QueryClaimableAmountRequest) returns (QueryClaimableAmountResponse);

  rpc Redemption(QueryRedemptionRequest) returns (QueryRedemptionResponse);
  rpc RedemptionsByHolder(QueryRedemptionsByHolderRequest) returns (QueryRedemptionsByHolderResponse);

  rpc Issuers(QueryIssuersRequest) returns (QueryIssuersResponse);
  rpc IsIssuer(QueryIsIssuerRequest) returns (QueryIsIssuerResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }

message QueryTokenRequest { uint64 id = 1; }
message QueryTokenResponse { Token token = 1 [(gogoproto.nullable) = false]; }

message QueryTokensRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryTokensResponse {
  repeated Token tokens = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryBalanceRequest {
  uint64 token_id = 1;
  string holder = 2;
}
message QueryBalanceResponse { uint64 amount = 1; }

message QueryFlagsRequest {
  uint64 token_id = 1;
  string holder = 2;
}
message QueryFlagsResponse { AccountFlags flags = 1 [(gogoproto.nullable) = false]; }

message QueryPoolBalanceRequest { uint64 token_id = 1; }
message QueryPoolBalanceResponse {
  string denom = 1;
  uint64 amount = 2;
}

message QuerySnapshotRequest { uint64 id = 1; }
message QuerySnapshotResponse { Snapshot snapshot = 1 [(gogoproto.nullable) = false]; }

message QueryDistributionRequest { uint64 id = 1; }
message QueryDistributionResponse { Distribution distribution = 1 [(gogoproto.nullable) = false]; }

message QueryClaimableAmountRequest {
  uint64 distribution_id = 1;
  string holder = 2;
}
message QueryClaimableAmountResponse {
  uint64 amount = 1;
  bool claimed = 2;
}

message QueryRedemptionRequest { uint64 id = 1; }
message QueryRedemptionResponse { Redemption redemption = 1 [(gogoproto.nullable) = false]; }

message QueryRedemptionsByHolderRequest {
  string holder = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryRedemptionsByHolderResponse {
  repeated Redemption redemptions = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryIssuersRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryIssuersResponse {
  repeated string issuers = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryIsIssuerRequest { string address = 1; }
message QueryIsIssuerResponse { bool is_issuer = 1; }

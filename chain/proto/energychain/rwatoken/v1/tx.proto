syntax = "proto3";
package energychain.rwatoken.v1;

import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";

import "energychain/rwatoken/v1/types.proto";

option go_package = "energychain/x/rwatoken/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc CreateToken(MsgCreateToken) returns (MsgCreateTokenResponse);
  rpc UpdateToken(MsgUpdateToken) returns (MsgUpdateTokenResponse);
  rpc SetTokenStatus(MsgSetTokenStatus) returns (MsgSetTokenStatusResponse);

  rpc Mint(MsgMint) returns (MsgMintResponse);
  rpc Burn(MsgBurn) returns (MsgBurnResponse);
  rpc Transfer(MsgTransfer) returns (MsgTransferResponse);
  rpc ForceTransfer(MsgForceTransfer) returns (MsgForceTransferResponse);
  rpc Freeze(MsgFreeze) returns (MsgFreezeResponse);
  rpc Unfreeze(MsgUnfreeze) returns (MsgUnfreezeResponse);

  rpc TakeSnapshot(MsgTakeSnapshot) returns (MsgTakeSnapshotResponse);
  rpc CreateDistribution(MsgCreateDistribution) returns (MsgCreateDistributionResponse);
  rpc ClaimDistribution(MsgClaimDistribution) returns (MsgClaimDistributionResponse);

  rpc FundPool(MsgFundPool) returns (MsgFundPoolResponse);
  rpc RequestRedemption(MsgRequestRedemption) returns (MsgRequestRedemptionResponse);
  rpc ExecuteRedemption(MsgExecuteRedemption) returns (MsgExecuteRedemptionResponse);
  rpc CancelRedemption(MsgCancelRedemption) returns (MsgCancelRedemptionResponse);

  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  rpc AddIssuer(MsgAddIssuer) returns (MsgAddIssuerResponse);
  rpc RemoveIssuer(MsgRemoveIssuer) returns (MsgRemoveIssuerResponse);
}

// ---- token lifecycle ------------------------------------------------------

message MsgCreateToken {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  string symbol = 2;
  string name = 3;
  string asset_class = 4;
  uint32 decimals = 5;
  string settlement_denom = 6;
  string policy_id = 7;
  bool require_kyc = 8;
  uint64 redemption_price = 9;
  int64 redemption_delay_seconds = 10;
  uint64 per_holder_cap = 11;
  string metadata_uri = 12;
  repeated string device_ids = 13; // x/assethub devices backing the token
  int64 maturity_time = 14;        // unix sec; 0 = perpetual
}
message MsgCreateTokenResponse { uint64 token_id = 1; }

message MsgUpdateToken {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  string metadata_uri = 3;
  string policy_id = 4;
  uint64 redemption_price = 5;
  int64 redemption_delay_seconds = 6;
  uint64 per_holder_cap = 7;
  repeated string device_ids = 8; // replaces the bound device set
  int64 maturity_time = 9;         // unix sec; 0 = perpetual
}
message MsgUpdateTokenResponse {}

message MsgSetTokenStatus {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  TokenStatus status = 3;
}
message MsgSetTokenStatusResponse {}

// ---- supply / transfer ----------------------------------------------------

message MsgMint {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  string recipient = 3;
  uint64 amount = 4;
}
message MsgMintResponse {}

message MsgBurn {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  string holder = 3;
  uint64 amount = 4;
}
message MsgBurnResponse {}

message MsgTransfer {
  option (cosmos.msg.v1.signer) = "from";
  string from = 1;
  uint64 token_id = 2;
  string to = 3;
  uint64 amount = 4;
}
message MsgTransferResponse {}

message MsgForceTransfer {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  string from = 3;
  string to = 4;
  uint64 amount = 5;
  string reason = 6;
}
message MsgForceTransferResponse {}

message MsgFreeze {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  string holder = 3;
}
message MsgFreezeResponse {}

message MsgUnfreeze {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  string holder = 3;
}
message MsgUnfreezeResponse {}

// ---- snapshot / dividend --------------------------------------------------

message MsgTakeSnapshot {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
}
message MsgTakeSnapshotResponse { uint64 snapshot_id = 1; }

message MsgCreateDistribution {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  uint64 snapshot_id = 3;
  uint64 total_amount = 4; // settlement_denom units pulled from admin
}
message MsgCreateDistributionResponse { uint64 distribution_id = 1; }

message MsgClaimDistribution {
  option (cosmos.msg.v1.signer) = "holder";
  string holder = 1;
  uint64 distribution_id = 2;
}
message MsgClaimDistributionResponse { uint64 amount = 1; }

// ---- redemption -----------------------------------------------------------

message MsgFundPool {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 token_id = 2;
  uint64 amount = 3; // settlement_denom units moved into the token pool
}
message MsgFundPoolResponse {}

message MsgRequestRedemption {
  option (cosmos.msg.v1.signer) = "holder";
  string holder = 1;
  uint64 token_id = 2;
  uint64 units = 3;
}
message MsgRequestRedemptionResponse {
  uint64 redemption_id = 1;
  uint64 payout = 2;
  int64 execute_after = 3;
}

message MsgExecuteRedemption {
  option (cosmos.msg.v1.signer) = "executor";
  string executor = 1; // admin or anyone after execute_after
  uint64 redemption_id = 2;
}
message MsgExecuteRedemptionResponse {}

message MsgCancelRedemption {
  option (cosmos.msg.v1.signer) = "admin";
  string admin = 1;
  uint64 redemption_id = 2;
  string reason = 3;
}
message MsgCancelRedemptionResponse {}

// ---- params ---------------------------------------------------------------

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

// ---- issuer whitelist -----------------------------------------------------
// Only whitelisted issuers (or the authority itself) may create RWA share
// tokens. The whitelist is governance-managed: both messages are
// authority-gated and typically executed via gov proposals.

message MsgAddIssuer {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string issuer = 2;       // bech32 account allowed to CreateToken
  string display_name = 3; // optional human-readable label (event only)
}
message MsgAddIssuerResponse {}

message MsgRemoveIssuer {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string issuer = 2;
}
message MsgRemoveIssuerResponse {}

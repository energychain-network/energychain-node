syntax = "proto3";
package energychain.dataslash.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "energychain/dataslash/v1/types.proto";

option go_package = "energychain/x/dataslash/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  // Provider lifecycle (authority gated).
  rpc RegisterProvider     (MsgRegisterProvider)     returns (MsgRegisterProviderResponse);
  rpc UpdateProviderInfo   (MsgUpdateProviderInfo)   returns (MsgUpdateProviderInfoResponse);

  // Bond lifecycle (provider's bond_owner gated).
  rpc PostBond             (MsgPostBond)             returns (MsgPostBondResponse);
  rpc IncreaseBond         (MsgIncreaseBond)         returns (MsgIncreaseBondResponse);
  rpc RequestUnbond        (MsgRequestUnbond)        returns (MsgRequestUnbondResponse);
  rpc WithdrawUnbonded     (MsgWithdrawUnbonded)     returns (MsgWithdrawUnbondedResponse);

  // Infractions (authority OR x/dispute-routed via authority).
  rpc ReportInfraction     (MsgReportInfraction)     returns (MsgReportInfractionResponse);

  // Discipline (authority gated).
  rpc JailProvider         (MsgJailProvider)         returns (MsgJailProviderResponse);
  rpc UnjailProvider       (MsgUnjailProvider)       returns (MsgUnjailProviderResponse);
  rpc BanProvider          (MsgBanProvider)          returns (MsgBanProviderResponse);

  rpc UpdateParams         (MsgUpdateParams)         returns (MsgUpdateParamsResponse);
}

// ---- Provider lifecycle ------------------------------------------------

message MsgRegisterProvider {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string did = 2;
  string signer_address = 3;
  string bond_owner = 4;
  string name = 5;
  ProviderRole role = 6;
  string bond_denom = 7; // overrides params.bond_denom_default when non-empty
  repeated string jurisdictions = 8;
}
message MsgRegisterProviderResponse { uint64 provider_id = 1; }

// UpdateProviderInfo lets authority rotate the bond_owner /
// jurisdictions / name. Signer_address rotation goes through
// a fresh registration (so the chain index stays a strict
// 1:1) to avoid silent identity drift.
message MsgUpdateProviderInfo {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  uint64 provider_id = 2;
  string new_name = 3;
  string new_bond_owner = 4;
  repeated string new_jurisdictions = 5;
}
message MsgUpdateProviderInfoResponse {}

// ---- Bond lifecycle ----------------------------------------------------

message MsgPostBond {
  option (cosmos.msg.v1.signer) = "bond_owner";
  string bond_owner = 1;
  uint64 provider_id = 2;
  uint64 amount = 3;
}
message MsgPostBondResponse { uint64 new_bond_amount = 1; }

message MsgIncreaseBond {
  option (cosmos.msg.v1.signer) = "bond_owner";
  string bond_owner = 1;
  uint64 provider_id = 2;
  uint64 amount = 3;
}
message MsgIncreaseBondResponse { uint64 new_bond_amount = 1; }

// RequestUnbond starts the cool-down: the provider's status
// flips to UNBONDING and accepts no new data, but the bond
// remains slashable until withdraw_at. Cool-down value comes
// from params.unbond_cooldown_seconds.
message MsgRequestUnbond {
  option (cosmos.msg.v1.signer) = "bond_owner";
  string bond_owner = 1;
  uint64 provider_id = 2;
}
message MsgRequestUnbondResponse { int64 withdraw_at = 1; }

message MsgWithdrawUnbonded {
  option (cosmos.msg.v1.signer) = "bond_owner";
  string bond_owner = 1;
  uint64 provider_id = 2;
}
message MsgWithdrawUnbondedResponse { uint64 withdrawn = 1; }

// ---- Discipline & Infractions -----------------------------------------

message MsgReportInfraction {
  option (cosmos.msg.v1.signer) = "actor";
  // actor must equal authority. The chain refuses non-authority
  // reporters; downstream modules can wrap their auto-detection
  // logic in their own keeper and call directly into x/dataslash
  // via Go interfaces rather than via a Msg, so abuse from random
  // signers is impossible.
  string actor = 1;
  uint64 provider_id = 2;
  InfractionKind kind = 3;
  uint32 override_slash_bps = 4; // 0 means "use the per-kind default"
  string evidence_uri = 5;
  string evidence_hash = 6;
  string reason = 7;
  // dispute_id is the x/dispute ruling that produced this
  // report; 0 when reported via direct authority action.
  uint64 dispute_id = 8;
}
message MsgReportInfractionResponse {
  uint64 infraction_id = 1;
  uint64 slashed_amount = 2;
}

message MsgJailProvider {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  uint64 provider_id = 2;
  int64 duration_seconds = 3;
  string reason = 4;
}
message MsgJailProviderResponse { int64 jailed_until = 1; }

message MsgUnjailProvider {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  uint64 provider_id = 2;
  string reason = 3;
}
message MsgUnjailProviderResponse {}

message MsgBanProvider {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  uint64 provider_id = 2;
  string reason = 3;
}
message MsgBanProviderResponse {}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

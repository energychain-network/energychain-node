syntax = "proto3";
package energychain.dataslash.v1;

import "gogoproto/gogo.proto";

option go_package = "energychain/x/dataslash/types";

// ProviderRole identifies the data-supply surface a provider
// is accredited for. A provider can be accredited for at most
// one role at a time; multi-role operators must register
// multiple providers under different DIDs.
enum ProviderRole {
  PROVIDER_ROLE_UNSPECIFIED = 0;
  PROVIDER_ROLE_ORACLE      = 1; // x/oracle attestor
  PROVIDER_ROLE_METER       = 2; // x/meter device gateway
  PROVIDER_ROLE_BRIDGE      = 3; // EVM bridge / external registry notary
  PROVIDER_ROLE_OTHER       = 4;
}

// ProviderStatus is the lifecycle gate that upstream modules
// (oracle, meter, bridge) consult to decide whether to accept
// data from a provider's signer address.
//
//   ACTIVE       — accepting data; can vote in attestation pools.
//   JAILED       — temporarily off-line; auto-restored after
//                  jail_until passes (handled in EndBlock).
//   BANNED       — permanent; only authority can recover via
//                  a fresh re-registration with a new DID.
//   UNBONDING    — bond withdrawal queued; provider cannot
//                  accept new attestations but existing
//                  outstanding bond is still slashable until
//                  withdraw_at passes.
//   WITHDRAWN    — bond fully reclaimed; effectively retired.
enum ProviderStatus {
  PROVIDER_STATUS_UNSPECIFIED = 0;
  PROVIDER_STATUS_ACTIVE      = 1;
  PROVIDER_STATUS_JAILED      = 2;
  PROVIDER_STATUS_BANNED      = 3;
  PROVIDER_STATUS_UNBONDING   = 4;
  PROVIDER_STATUS_WITHDRAWN   = 5;
}

// InfractionKind taxonomizes the misbehavior. The kind drives
// (a) the default slash_bps applied if the caller doesn't
// override, and (b) the threshold counter for auto-jail.
enum InfractionKind {
  INFRACTION_KIND_UNSPECIFIED      = 0;
  INFRACTION_KIND_MISREPORT        = 1; // bad value vs. consensus / proof
  INFRACTION_KIND_STALE            = 2; // value beyond freshness window
  INFRACTION_KIND_MISSING_SIG      = 3; // device / attestor signature missing
  INFRACTION_KIND_EQUIVOCATION     = 4; // two conflicting attestations
  INFRACTION_KIND_UNREACHABLE      = 5; // failure to respond within window
  INFRACTION_KIND_DISPUTE_RULING   = 6; // resolved by x/dispute
  INFRACTION_KIND_OTHER            = 7;
}

// Provider is the registered data source. The chain pairs a
// stable on-chain identifier (id, did, signer_address) with
// the bond that backs it; upstream modules (oracle, meter,
// bridge) only need the signer_address ↔ provider_id mapping.
message Provider {
  uint64 id = 1;
  string did = 2;
  string signer_address = 3;
  string name = 4;
  ProviderRole role = 5;

  // Bond is held in the module-derived pool while ACTIVE
  // (or UNBONDING). Slashing debits bond_amount; refund on
  // withdraw_unbonded credits the residual back to bond_owner.
  string bond_denom = 6;
  uint64 bond_amount = 7;       // currently locked in the pool
  uint64 required_bond = 8;     // params-derived floor for the role
  string bond_owner = 9;        // the account whose balance backs the bond

  ProviderStatus status = 10;

  // Lifecycle timestamps.
  int64 created_at = 11;
  int64 updated_at = 12;
  int64 jail_until = 13;     // unix seconds; 0 if not JAILED
  int64 withdraw_at = 14;    // unix seconds; 0 unless UNBONDING

  repeated string jurisdictions = 15;

  // infraction_count is the running tally of CONFIRMED
  // infractions since registration. When it crosses
  // auto_jail_threshold, EndBlock auto-jails for params.
  // auto_jail_seconds; crossing auto_ban_threshold triggers a
  // permanent ban. Both thresholds are governance-controlled.
  uint32 infraction_count = 16;
}

// Infraction is an append-only record of a confirmed
// misbehavior plus the bond slash applied at that time.
message Infraction {
  uint64 id = 1;
  uint64 provider_id = 2;
  InfractionKind kind = 3;
  uint32 slash_bps = 4;     // 0–10000
  uint64 slashed_amount = 5; // computed at processing time
  string evidence_uri = 6;
  string evidence_hash = 7;
  string reporter = 8;       // who filed (authority OR governance OR dispute resolver)
  uint64 dispute_id = 9;     // 0 unless filed via x/dispute ruling
  int64 occurred_at = 10;
  int64 processed_at = 11;
  string reason = 12;
}

// JailRecord is the audit-grade log of every JAIL transition.
// Used to support a fairness query "show all jails of provider
// X over the last N days".
message JailRecord {
  uint64 id = 1;
  uint64 provider_id = 2;
  string reason = 3;
  int64 jailed_at = 4;
  int64 jailed_until = 5;
  string actor = 6;
  bool auto = 7; // true when produced by the auto-jail threshold sweep
}

// BanRecord is the audit-grade log of permanent bans.
message BanRecord {
  uint64 id = 1;
  uint64 provider_id = 2;
  string reason = 3;
  int64 banned_at = 4;
  string actor = 5;
  bool auto = 6;
}

message Params {
  uint32 max_providers = 1;
  uint32 max_infractions_per_provider = 2;
  uint32 max_jurisdictions_per_provider = 3;

  // Per-role minimum bonds; missing entries fall back to
  // min_bond_default. Roles known to the chain are the
  // enum values of ProviderRole; entries for UNSPECIFIED
  // are ignored.
  uint64 min_bond_default = 4;
  uint64 min_bond_oracle = 5;
  uint64 min_bond_meter = 6;
  uint64 min_bond_bridge = 7;
  string bond_denom_default = 8;

  // Default slash percentages per infraction kind (basis
  // points, 0–10000). Caller-provided slash_bps overrides
  // these for authority / dispute-driven reports.
  uint32 default_slash_bps_misreport = 9;
  uint32 default_slash_bps_stale = 10;
  uint32 default_slash_bps_missing_sig = 11;
  uint32 default_slash_bps_equivocation = 12;
  uint32 default_slash_bps_unreachable = 13;
  uint32 default_slash_bps_dispute_ruling = 14;
  uint32 default_slash_bps_other = 15;

  // Auto-jail / auto-ban thresholds and durations.
  uint32 auto_jail_threshold = 16;     // running infraction count
  int64  auto_jail_seconds = 17;       // duration of an auto-jail
  uint32 auto_ban_threshold = 18;
  int64  unbond_cooldown_seconds = 19; // delay between request_unbond and withdraw

  // Bounded text fields.
  uint32 memo_max_len = 20;
  uint32 reason_max_len = 21;
  uint32 uri_max_len = 22;

  // Sweep budgets per block.
  uint32 max_processings_per_block = 23;
}

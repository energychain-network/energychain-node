syntax = "proto3";
package energychain.assethub.v1;

import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";

import "energychain/assethub/v1/types.proto";

option go_package = "energychain/x/assethub/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  // Provider lifecycle (self-service + governance slashing).
  rpc RegisterProvider(MsgRegisterProvider) returns (MsgRegisterProviderResponse);
  rpc IncreaseBond(MsgIncreaseBond) returns (MsgIncreaseBondResponse);
  rpc WithdrawBond(MsgWithdrawBond) returns (MsgWithdrawBondResponse);
  rpc DeregisterProvider(MsgDeregisterProvider) returns (MsgDeregisterProviderResponse);
  rpc SlashProvider(MsgSlashProvider) returns (MsgSlashProviderResponse);
  rpc UnjailProvider(MsgUnjailProvider) returns (MsgUnjailProviderResponse);

  // Devices (operator).
  rpc RegisterDevice(MsgRegisterDevice) returns (MsgRegisterDeviceResponse);
  rpc UpdateDevice(MsgUpdateDevice) returns (MsgUpdateDeviceResponse);
  rpc AttestDevice(MsgAttestDevice) returns (MsgAttestDeviceResponse);
  rpc RevokeDevice(MsgRevokeDevice) returns (MsgRevokeDeviceResponse);

  // Metering readings (METER / DEVICE provider).
  rpc SubmitReading(MsgSubmitReading) returns (MsgSubmitReadingResponse);

  // Oracle (ORACLE provider + governance topic management).
  rpc CreateTopic(MsgCreateTopic) returns (MsgCreateTopicResponse);
  rpc SubmitValue(MsgSubmitValue) returns (MsgSubmitValueResponse);

  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// ---- Provider -------------------------------------------------------------

message MsgRegisterProvider {
  option (cosmos.msg.v1.signer) = "provider";
  string provider = 1;
  ProviderRole role = 2;
  string display_name = 3;
  uint64 bond = 4; // must be >= params.min_bond
}
message MsgRegisterProviderResponse {}

message MsgIncreaseBond {
  option (cosmos.msg.v1.signer) = "provider";
  string provider = 1;
  uint64 amount = 2;
}
message MsgIncreaseBondResponse { uint64 new_bond = 1; }

message MsgWithdrawBond {
  option (cosmos.msg.v1.signer) = "provider";
  string provider = 1;
  uint64 amount = 2; // remaining bond must stay >= params.min_bond
}
message MsgWithdrawBondResponse { uint64 new_bond = 1; }

message MsgDeregisterProvider {
  option (cosmos.msg.v1.signer) = "provider";
  string provider = 1; // refunds full bond; must own no active devices
}
message MsgDeregisterProviderResponse {}

message MsgSlashProvider {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string provider = 2;
  string reason = 3;
}
message MsgSlashProviderResponse {
  uint64 slashed = 1;
  bool jailed = 2;
}

message MsgUnjailProvider {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string provider = 2;
}
message MsgUnjailProviderResponse {}

// ---- Device ---------------------------------------------------------------

message MsgRegisterDevice {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1;
  string id = 2;
  string device_type = 3;
  string pubkey = 4;
  string jurisdiction = 5;
}
message MsgRegisterDeviceResponse {}

message MsgUpdateDevice {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1;
  string id = 2;
  string device_type = 3;
  string jurisdiction = 4;
}
message MsgUpdateDeviceResponse {}

message MsgAttestDevice {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1;
  string id = 2;
  string attestation_hash = 3;
  string firmware = 4;
}
message MsgAttestDeviceResponse {}

message MsgRevokeDevice {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1; // device operator OR governance authority
  string id = 2;
  string reason = 3;
}
message MsgRevokeDeviceResponse {}

// ---- Reading --------------------------------------------------------------

message MsgSubmitReading {
  option (cosmos.msg.v1.signer) = "provider";
  string provider = 1;
  string device_id = 2;
  int64 period_start = 3;
  int64 period_end = 4;
  string unit = 5;
  uint64 iot_value = 6;
  uint64 operational_value = 7;
}
message MsgSubmitReadingResponse {
  uint64 reading_id = 1;
  bool verified = 2;
}

// ---- Oracle ---------------------------------------------------------------

message MsgCreateTopic {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string id = 2;
  string description = 3;
  uint32 min_sources = 4;
}
message MsgCreateTopicResponse {}

message MsgSubmitValue {
  option (cosmos.msg.v1.signer) = "provider";
  string provider = 1;
  string topic_id = 2;
  uint64 value = 3;
}
message MsgSubmitValueResponse {
  uint64 aggregated_value = 1;
  bool has_value = 2;
}

// ---- Params ---------------------------------------------------------------

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

syntax = "proto3";
package energychain.auction.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";

import "energychain/auction/v1/types.proto";

option go_package = "energychain/x/auction/types";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);
  rpc Auction(QueryAuctionRequest) returns (QueryAuctionResponse);
  rpc Auctions(QueryAuctionsRequest) returns (QueryAuctionsResponse);
  rpc AuctionsBySeller(QueryAuctionsBySellerRequest) returns (QueryAuctionsBySellerResponse);
  rpc Bid(QueryBidRequest) returns (QueryBidResponse);
  rpc BidsByAuction(QueryBidsByAuctionRequest) returns (QueryBidsByAuctionResponse);
  rpc DutchPrice(QueryDutchPriceRequest) returns (QueryDutchPriceResponse);
  rpc PoolAddress(QueryPoolAddressRequest) returns (QueryPoolAddressResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }

message QueryAuctionRequest { uint64 id = 1; }
message QueryAuctionResponse { Auction auction = 1 [(gogoproto.nullable) = false]; }

message QueryAuctionsRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryAuctionsResponse {
  repeated Auction auctions = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryAuctionsBySellerRequest {
  string seller = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryAuctionsBySellerResponse {
  repeated Auction auctions = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryBidRequest { uint64 id = 1; }
message QueryBidResponse { Bid bid = 1 [(gogoproto.nullable) = false]; }

message QueryBidsByAuctionRequest {
  uint64 auction_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryBidsByAuctionResponse {
  repeated Bid bids = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryDutchPriceRequest {
  uint64 auction_id = 1;
  int64  at_time = 2;
}
message QueryDutchPriceResponse { uint64 price = 1; }

message QueryPoolAddressRequest {}
message QueryPoolAddressResponse { string pool = 1; }

syntax = "proto3";
package energychain.auction.v1;

import "gogoproto/gogo.proto";

import "energychain/auction/v1/types.proto";

option go_package = "energychain/x/auction/types";

message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  uint64 next_auction_id = 2;
  uint64 next_bid_id = 3;
  repeated Auction auctions = 4 [(gogoproto.nullable) = false];
  repeated Bid bids = 5 [(gogoproto.nullable) = false];
}

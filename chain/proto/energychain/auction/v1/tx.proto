syntax = "proto3";
package energychain.auction.v1;

import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";

import "energychain/auction/v1/types.proto";

option go_package = "energychain/x/auction/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc CreateAuction(MsgCreateAuction) returns (MsgCreateAuctionResponse);
  rpc CancelAuction(MsgCancelAuction) returns (MsgCancelAuctionResponse);

  // English / Dutch flow.
  rpc PlaceBid(MsgPlaceBid) returns (MsgPlaceBidResponse);

  // Sealed flow.
  rpc CommitBid(MsgCommitBid) returns (MsgCommitBidResponse);
  rpc RevealBid(MsgRevealBid) returns (MsgRevealBidResponse);

  // Anyone can call after end_time (or reveal_end_time for sealed).
  rpc Close(MsgClose) returns (MsgCloseResponse);
  // Anyone can call after Close to push the winning amount to
  // the seller. Idempotent across multiple calls (no-op on
  // already SETTLED).
  rpc Settle(MsgSettle) returns (MsgSettleResponse);

  // Loser refund self-service. Failed-to-reveal sealed bids
  // (BID_STATUS_FORFEITED) are NOT refundable here; the deposit
  // is paid to the seller as part of Settle.
  rpc WithdrawRefund(MsgWithdrawRefund) returns (MsgWithdrawRefundResponse);

  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgCreateAuction {
  option (cosmos.msg.v1.signer) = "seller";

  string seller = 1;
  Kind   kind = 2;
  string asset_ref = 3;
  string payment_denom = 4;

  uint64 reserve_price = 5;
  uint64 min_bid_increment = 6;        // english only

  uint64 dutch_start_price = 7;        // dutch only
  uint64 dutch_floor_price = 8;        // dutch only
  int64  dutch_decay_seconds = 9;      // dutch only

  int64 start_time = 10;
  int64 commit_end_time = 11;          // sealed only
  int64 reveal_end_time = 12;          // sealed only
  int64 end_time = 13;                 // english / dutch only

  string memo = 14;
}
message MsgCreateAuctionResponse { uint64 auction_id = 1; }

message MsgCancelAuction {
  option (cosmos.msg.v1.signer) = "seller";
  string seller = 1;
  uint64 auction_id = 2;
  string reason = 3;
}
message MsgCancelAuctionResponse {}

message MsgPlaceBid {
  option (cosmos.msg.v1.signer) = "bidder";
  string bidder = 1;
  uint64 auction_id = 2;
  // For ENGLISH: must be > current high + min_bid_increment.
  // For DUTCH: must be >= price(now). If higher, the surplus is
  //            still escrowed but the clearing price is the
  //            bidder's stated price (not the lower curve price)
  //            — sealed bidder convenience, intentional.
  uint64 price = 3;
}
message MsgPlaceBidResponse { uint64 bid_id = 1; }

message MsgCommitBid {
  option (cosmos.msg.v1.signer) = "bidder";
  string bidder = 1;
  uint64 auction_id = 2;
  // commit_hash MUST equal sha256(price || ":" || salt) where
  // price is decimal-formatted ASCII and salt is raw bytes.
  // The hash binding is enforced at Reveal.
  bytes commit_hash = 3;
  // Deposit is the bidder-chosen cap >= the eventual revealed
  // price. Allows price-private commits without leaking the
  // price via the deposit value.
  uint64 deposit = 4;
}
message MsgCommitBidResponse { uint64 bid_id = 1; }

message MsgRevealBid {
  option (cosmos.msg.v1.signer) = "bidder";
  string bidder = 1;
  uint64 bid_id = 2;
  uint64 price = 3;
  bytes  salt = 4;
}
message MsgRevealBidResponse {}

message MsgClose {
  option (cosmos.msg.v1.signer) = "caller";
  string caller = 1;
  uint64 auction_id = 2;
}
message MsgCloseResponse {
  string winner = 1;
  uint64 clearing_price = 2;
}

message MsgSettle {
  option (cosmos.msg.v1.signer) = "caller";
  string caller = 1;
  uint64 auction_id = 2;
}
message MsgSettleResponse { uint64 paid_to_seller = 1; }

message MsgWithdrawRefund {
  option (cosmos.msg.v1.signer) = "bidder";
  string bidder = 1;
  uint64 bid_id = 2;
}
message MsgWithdrawRefundResponse { uint64 refunded = 1; }

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

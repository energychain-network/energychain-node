syntax = "proto3";
package energychain.identity.v1;

import "gogoproto/gogo.proto";

option go_package = "energychain/x/identity/types";

// Identity represents a registered participant in the energy chain.
message Identity {
  string address = 1;
  string name = 2;
  string role = 3;
  string status = 4;
  string metadata = 5;
  int64 registered_at = 6;
  int64 updated_at = 7;
}

// Params defines the identity module parameters.
//
// max_metadata_size caps the byte length of MsgRegisterIdentity.metadata and
// MsgUpdateIdentity.metadata to bound on-chain footprint.
message Params {
  string admin_address = 1;
  uint32 max_metadata_size = 2;
}

syntax = "proto3";
package energychain.identity.v1;

import "gogoproto/gogo.proto";
import "energychain/identity/v1/types.proto";

option go_package = "energychain/x/identity/types";

message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated Account accounts = 2 [(gogoproto.nullable) = false];
  repeated Registrar registrars = 3 [(gogoproto.nullable) = false];
  repeated Sanction sanctions = 4 [(gogoproto.nullable) = false];
  repeated Policy policies = 5 [(gogoproto.nullable) = false];
  repeated AuditEntry audit_entries = 6 [(gogoproto.nullable) = false];
  uint64 audit_seq = 7;
}

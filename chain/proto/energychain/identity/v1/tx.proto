syntax = "proto3";
package energychain.identity.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "energychain/identity/v1/types.proto";

option go_package = "energychain/x/identity/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc RegisterIdentity(MsgRegisterIdentity) returns (MsgRegisterIdentityResponse);
  rpc UpdateIdentity(MsgUpdateIdentity) returns (MsgUpdateIdentityResponse);
  rpc RevokeIdentity(MsgRevokeIdentity) returns (MsgRevokeIdentityResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgRegisterIdentity {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 3;
  string role = 4;
  string metadata = 5;
}
message MsgRegisterIdentityResponse {}

message MsgUpdateIdentity {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 3;
  string metadata = 4;
}
message MsgUpdateIdentityResponse {}

message MsgRevokeIdentity {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string reason = 3;
}
message MsgRevokeIdentityResponse {}

// MsgUpdateParams replaces the entire identity module Params. Signer must
// be the module authority (gov module address).
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

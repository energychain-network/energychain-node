###############################################################################
###                         Energy Chain - app.toml                         ###
###############################################################################

###############################################################################
###                           Base Configuration                            ###
###############################################################################

minimum-gas-prices = "10000000000uecy"

pruning = "default"

# pruning-keep-recent, pruning-interval are used with custom pruning
pruning-keep-recent = "0"
pruning-interval = "0"

halt-height = 0
halt-time = 0

min-retain-blocks = 0

inter-block-cache = true

index-events = []

iavl-cache-size = 781250

iavl-disable-fastnode = false

iavl-lazy-loading = false

app-db-backend = ""

###############################################################################
###                         Telemetry Configuration                         ###
###############################################################################

[telemetry]

service-name = "energychain"

enabled = true

enable-hostname = true
enable-hostname-label = false
enable-service-label = false

prometheus-retention-time = 60

global-labels = []

###############################################################################
###                           API Configuration                             ###
###############################################################################

[api]

enable = true

swagger = true

address = "tcp://0.0.0.0:1317"

max-open-connections = 1000

rpc-read-timeout = 10
rpc-write-timeout = 0

rpc-max-body-bytes = 1000000

enabled-unsafe-cors = true

###############################################################################
###                          gRPC Configuration                             ###
###############################################################################

[grpc]

enable = true

address = "0.0.0.0:9090"

max-recv-msg-size = "10485760"
max-send-msg-size = "2147483647"

###############################################################################
###                        gRPC Web Configuration                           ###
###############################################################################

[grpc-web]

enable = true

address = "0.0.0.0:9091"

enable-unsafe-cors = true

###############################################################################
###                        State Sync Configuration                         ###
###############################################################################

[state-sync]

# snapshot-interval = N has every node take an IAVL snapshot every N blocks
# and serve it to peers. New validators / archive nodes can then state-sync
# in minutes instead of replaying months of blocks.
# 1000 ~ every ~25 minutes at a 1.5s block target; tune up for slower disks.
snapshot-interval = 1000

# Keep the 5 most recent snapshots on disk; older ones are pruned automatically.
snapshot-keep-recent = 5

###############################################################################
###                         Streaming Configuration                          ###
###############################################################################

# ABCI block-data streaming. Enables off-chain indexers / data warehouses to
# subscribe to every committed block + state delta over a unix socket or file.
# Disabled by default; set keys = ["*"] and configure a plugin to turn on.
[streaming]

[streaming.abci]
# Comma-separated store keys to stream; "*" means all stores.
keys = []
# Plugin name registered via store/streaming/abci.RegisterStreamingService.
plugin = ""
# If true, block commit waits for the streaming write to flush. Safer but
# slower; recommended for reliable indexer pipelines.
stop-node-on-err = true

###############################################################################
###                             EVM Configuration                            ###
###############################################################################

[evm]

tracer = ""

max-tx-gas-wanted = 0

cache-preimage = false

evm-chain-id = 262144

min-tip = 0

geth-metrics-address = "127.0.0.1:8100"

[evm.mempool]

price-limit = 1

price-bump = 10

account-slots = 16

global-slots = 5120

account-queue = 64

global-queue = 1024

lifetime = "3h0m0s"

operate-exclusively = true

pending-tx-proposal-timeout = "250ms"

insert-queue-size = "5000"

###############################################################################
###                         JSON-RPC Configuration                          ###
###############################################################################

[json-rpc]

enable = true

address = "0.0.0.0:8545"

ws-address = "0.0.0.0:8546"

api = "eth,txpool,net,web3"

gas-cap = 25000000

evm-timeout = "5s"

txfee-cap = 1

filter-cap = 200

feehistory-cap = 100

logs-cap = 10000

block-range-cap = 10000

http-timeout = "30s"
http-idle-timeout = "120s"

allow-unprotected-txs = false

max-open-connections = 0

enable-indexer = false

metrics-address = "0.0.0.0:6065"

###############################################################################
###                            TLS Configuration                            ###
###############################################################################

[tls]

certificate-path = ""
key-path = ""

###############################################################################
###                          Rosetta Configuration                          ###
###############################################################################

[rosetta]

enable = false

address = ":8080"

blockchain = "energychain"
network = "energychain_9001-1"

retries = 3

offline = false
